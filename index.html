  function buildHistoricoWorkbook(){
    const wb = new ExcelJS.Workbook();
    const currentKey = monthKey(todayISO());
    const cols = [
      { header: 'Mês', key: 'mes', width: 14 },
      { header: 'Treinos Interno', key: 'treinosInterno', width: 15 },
      { header: 'Treinos Externo', key: 'treinosExterno', width: 15 },
      { header: 'Treinos Total', key: 'treinosTotal', width: 13 },
      { header: 'Patamar', key: 'patamar', width: 10 },
      { header: 'Cadernetas Vendidas Interno', key: 'cadernetasInterno', width: 22 },
      { header: 'Cadernetas Vendidas Externo', key: 'cadernetasExterno', width: 22 },
      { header: 'Comissão Interno (€)', key: 'comissaoInterno', width: 18 },
      { header: 'Comissão Externo (€)', key: 'comissaoExterno', width: 18 },
      { header: 'Receita Prevista Total (€)', key: 'receitaPrevistaTotal', width: 20 },
    ];
    const rows = [];
    for(let i = 0; i >= -11; i--){
      const m = computeHistoricoMes(addMonths(currentKey, i));
      rows.push({
        mes: monthLabel(m.key),
        treinosInterno: m.treinosInterno, treinosExterno: m.treinosExterno, treinosTotal: m.treinosTotal,
        patamar: m.patamar === 'alto' ? `>= ${PATAMAR_INTERNO}` : `< ${PATAMAR_INTERNO}`,
        cadernetasInterno: m.cadernetasInterno, cadernetasExterno: m.cadernetasExterno,
        comissaoInterno: Number(m.comissaoInterno.toFixed(2)),
        comissaoExterno: Number(m.comissaoExterno.toFixed(2)),
        receitaPrevistaTotal: Number(m.receitaPrevista.toFixed(2)),
      });
    }
    addStyledSheet(wb, 'Histórico Mensal', cols, rows, {
      comissaoInterno: 'pt',
      comissaoExterno: 'deve',
      receitaPrevistaTotal: 'ginasio',
    });
    return wb;
  }

  // Resumo de um único mês para o Histórico Mensal: treinos, cadernetas vendidas
  // (Interno/Externo), patamar e finanças — tudo reaproveitado das mesmas funções
  // usadas em Finanças, para nunca haver divergência entre separadores.
  function computeHistoricoMes(key){
    const [start, end] = monthRange(key);
    const t = computeTreinosMes(key);
    const r = computeReceitaMes(key);
    let cadernetasInterno = 0, cadernetasExterno = 0;
    state.clients.forEach(c => {
      const n = receitaDatesInMonthForClient(c, start, end).length;
      if(n === 0) return;
      if(c.tipo === 'Externo') cadernetasExterno += n; else cadernetasInterno += n;
    });
    return {
      key,
      treinosInterno: t.internoCount, treinosExterno: t.externoCount, treinosTotal: t.total,
      patamar: t.patamar,
      cadernetasInterno, cadernetasExterno,
      comissaoInterno: t.comissaoInterno, comissaoExterno: t.comissaoExterno,
      receitaPrevista: r.total
    };
  }

        <div class="field-row"><span class="k">Externo (direto ao PT)</span><span class="v">${d.totalExterno.toFixed(2)}€</span></div>

          <span class="k"><strong>Total recebido</strong></span><span class="v"><strong>${d.totalValor.toFixed(2)}€</strong></span>
        </div>
        <div class="field-row"><span class="k">Cadernetas pagas</span><span class="v">${d.totalCadernetas}</span></div>
        <div class="field-row"><span class="k">Sessões pagas</span><span class="v">${d.totalSessoes}</span></div>

      <div class="empty-state" style="text-align:left">Baseado nos pagamentos realmente registados (data do pagamento), não numa projeção. Um pagamento adiantado que cubra várias cadernetas conta por inteiro no mês em que foi feito — valor total e todas as sessões dessas cadernetas.</div>
    `;
  }

  function renderDetail(c){
    const done = cycleTrainedCount(c);
    const total = sessoesEsperadasAtuaisComAtraso(c);
    let stampsLg = '';
    for(let i=0; i<Math.max(total,done); i++){
      if(i < total){
        stampsLg += `<div class="stamp-lg ${i<done?'filled':''}">${i<done?'✓':''}</div>`;
      } else {
        stampsLg += `<div class="stamp-lg extra">✓</div>`;
      }
    }
    const daysLeft = daysBetween(todayISO(), c.cicloValidade);
    const ultimoTreinoInfo = ultimoTreino(c);
    const cadernetasHistorico = computeCadernetasHistorico(c);
    const pagamentosOrdenados = (c.pagamentos||[]).slice().sort((a,b)=>b.data.localeCompare(a.data));
    const totalPago = (c.pagamentos||[]).reduce((s,p)=>s+Number(p.valor||0),0);
    const bdayDays = daysToNextBirthday(c.nascimento);

    return `
      <div class="overlay-header">
        <button class="backbtn" id="backBtn">←</button>
        <h2>${escapeHtml(c.nome)}</h2>
        <button class="backbtn" id="editBtn" title="Editar">✎</button>
      </div>
      <div class="overlay-body">

        <div class="card">
          <h3>Informação</h3>
          <div class="field-row"><span class="k">Código</span><span class="v">${escapeHtml(c.id)}</span></div>
          <div class="field-row"><span class="k">Tipo</span><span class="v"><span class="badge-tipo ${c.tipo==='Externo'?'externo':'interno'}">${c.tipo}</span></span></div>
          <div class="field-row"><span class="k">Idade</span><span class="v">${age(c.nascimento) ?? '—'} anos ${bdayDays<=30?`(🎂 em ${bdayDays===0?'hoje':bdayDays+'d'})`:''}</span></div>
          <div class="field-row"><span class="k">Nascimento</span><span class="v">${fmtDateShort(c.nascimento)}</span></div>
          <div class="field-row"><span class="k">Contacto</span><span class="v">${c.contacto?`<a href="tel:${escapeAttr(c.contacto)}">${escapeHtml(c.contacto)}</a>`:'—'}</span></div>
          <div class="field-row"><span class="k">Email</span><span class="v">${c.email?`<a href="mailto:${escapeAttr(c.email)}">${escapeHtml(c.email)}</a>`:'—'}</span></div>
          <div class="field-row"><span class="k">Atividade</span><span class="v">${escapeHtml(c.atividade||'—')}</span></div>
          <div class="field-row"><span class="k">Serviço (comissão)</span><span class="v">${escapeHtml(c.servico||'—')}</span></div>
          <div class="field-row"><span class="k">Valor da caderneta</span><span class="v">${Number(c.valorCaderneta||0).toFixed(2)}€</span></div>
          ${c.pagoAte ? `<div class="field-row"><span class="k">Pago adiantado até</span><span class="v">${fmtDateShort(c.pagoAte)}</span></div>` : ''}
        </div>

        <div class="card">
          <h3>Caderneta</h3>
          <div class="field-row"><span class="k">Início do Serviço</span><span class="v">${fmtDateShort(c.cicloInicio)}</span></div>
          <div class="field-row"><span class="k">Início da Caderneta</span><span class="v">${fmtDateShort(inicioCaderneta(c))}</span></div>
          <div class="field-row"><span class="k">Válida até</span><span class="v">${fmtDateShort(c.cicloValidade)}</span></div>
          <div class="field-row"><span class="k">Dias restantes</span><span class="v">${daysLeft<0?`expirou há ${Math.abs(daysLeft)}d`:daysLeft+'d'}</span></div>
          <div class="field-row"><span class="k">Sessões esperadas</span><span class="v">${total}</span></div>
          <div class="field-row"><span class="k">Último treino</span><span class="v">${ultimoTreinoInfo ? `${fmtDateShort(ultimoTreinoInfo.data)}${ultimoTreinoInfo.hora?` às ${ultimoTreinoInfo.hora}`:''}` : '—'}</span></div>
          <div class="field-row"><span class="k">Próximo treino</span><span class="v">${c.proximoTreino ? `${fmtDateShort(c.proximoTreino.data)}${c.proximoTreino.hora?` às ${c.proximoTreino.hora}`:''}` : '—'}</span></div>
          ${c.proximoTreino && c.contacto ? `<button class="btn btn-secondary" id="btnPreviewWhatsApp" style="margin-top:8px">Enviar lembrete por WhatsApp</button>` : ''}
          <div class="progress-big">${stampsLg}</div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-primary" id="btnRegistarTreino">Registar treino</button>
          </div>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn btn-secondary" id="btnRenovar">Renovar (+4 sem.)</button>
            <button class="btn btn-secondary" id="btnProlongar">Prolongar</button>
          </div>
        </div>

        <div class="card">
          <h3>Histórico de treinos por caderneta (${(c.treinos||[]).length} no total)</h3>
          <p style="color:var(--text-muted);font-size:12px;margin:0 0 12px">Cadernetas reais, delimitadas pelo Início/Válida até de cada ciclo (incluindo prolongamentos). Toca no lápis para editar as datas de uma caderneta anterior, na lixeira para a eliminar (funde-a com a anterior), ou num treino para o editar/reatribuir.</p>
          ${cadernetasHistorico.length===0 ? '<div class="empty-state">Ainda sem treinos registados.</div>' :
            cadernetasHistorico.slice().reverse().map(bloco => `
              <div class="caderneta-block">
                <div class="caderneta-block-head">
                  <span>${bloco.numero===0?'Antes do histórico rastreado':`Caderneta ${bloco.numero}`}${bloco.emCurso?' (em curso)':''}${bloco.prolongada?' <span class="badge-tipo externo">Prolongada</span>':''}</span>
                  <span style="display:flex;align-items:center;gap:8px">
                    <span class="mono">${bloco.treinos.length}/${bloco.esperadasComAtraso}</span>
                    ${bloco.editavel ? `<button class="backbtn" data-edit-caderneta="${bloco.inicio}|${bloco.fim}|${bloco.emCurso?'1':'0'}" title="Editar esta caderneta" style="width:26px;height:26px;font-size:13px">✎</button>` : ''}
                    ${bloco.editavel ? `<button class="backbtn" data-del-caderneta="${bloco.inicio}|${bloco.emCurso?'1':'0'}" title="Eliminar esta caderneta (funde com a anterior)" style="width:26px;height:26px;font-size:13px">🗑</button>` : ''}
                  </span>
                </div>
                <div class="caderneta-block-range">${bloco.inicio?`${fmtDateShort(bloco.inicio)} – `:'até '}${fmtDateShort(bloco.fim)}${bloco.prolongada?` · ${bloco.dias} dias`:''}</div>
                ${bloco.treinos.map(t => `
                  <div class="list-item">
                    <span data-edit-treino="${t.id}" style="cursor:pointer">${fmtDateShort(t.data)}${t.hora?` ${t.hora}`:''} ${t.nota?`— ${escapeHtml(t.nota)}`:''}${t.googleEventId?' <span class="badge-inline bday">Calendar</span>':''}</span>
                    <button class="del" data-del-treino="${t.id}">×</button>
                  </div>
                `).join('')}
              </div>
            `).join('')
          }
        </div>

        <div class="card">
          <h3>Pagamentos (total: ${totalPago.toFixed(2)}€)</h3>
          <button class="btn btn-secondary" id="btnAddPagamento">Registar pagamento</button>
          ${pagamentosOrdenados.length===0 ? '<div class="empty-state" style="margin-top:10px">Ainda sem pagamentos registados.</div>' :
            `<div style="margin-top:10px">` + pagamentosOrdenados.map(p => `
              <div class="list-item">
                <span>${fmtDateShort(p.data)} — <strong>${Number(p.valor).toFixed(2)}€</strong>${p.cadernetaRef?` <span class="badge-inline bday">Caderneta(s) ${escapeHtml(p.cadernetaRef)} · ${pagamentoCoberturaLabel(p, c)}</span>`:''} ${p.nota?`(${escapeHtml(p.nota)})`:''}</span>
                <span style="display:flex;gap:6px">
                  <button class="backbtn" data-edit-pag="${p.id}" title="Editar pagamento" style="width:26px;height:26px;font-size:13px">✎</button>
                  <button class="del" data-del-pag="${p.id}">×</button>
                </span>
              </div>
            `).join('') + `</div>`
          }
        </div>

        <div class="card">
          <h3>Histórico de alterações</h3>
          ${(!c.historico || c.historico.length===0) ? '<div class="empty-state">Sem alterações registadas.</div>' :
            c.historico.map((h,idx) => `
              <div class="history-entry">
                <div class="history-head">
                  <span>${escapeHtml(h.label)}</span><span class="mono">${fmtDateTime(h.quando)}</span>
                </div>
                ${h.changes.map(ch => `<div class="history-line">${escapeHtml(ch.rotulo)}: ${escapeHtml(formatChangeValue(ch.campo, ch.antes))} → ${escapeHtml(formatChangeValue(ch.campo, ch.depois))}</div>`).join('')}
                ${idx>0 ? '<div style="color:var(--text-dim);font-size:11px;margin-top:6px">Há alterações mais recentes que podem ter mexido nos mesmos campos.</div>' : ''}
                <button class="btn btn-secondary" data-undo-entry="${h.id}" style="margin-top:8px;width:auto;padding:6px 14px;font-size:12px">↩ Desfazer esta alteração</button>
              </div>
            `).join('')
          }
        </div>

        <button class="btn btn-danger" id="btnDeleteClient">Remover cliente</button>
      </div>
    `;
  }

    const c = existing || {
      id: '', nome: '', sexo: 'F', nascimento: '', contacto: '', email: '',
      atividade: '', sessoesEsperadas: 4, cicloInicio: todayISO(),
      cicloValidade: addDays(todayISO(), 28), inicioCadernetaAtual: todayISO(), treinos: [], pagamentos: [], ativo: true,
      tipo: 'Interno', servico: 'PT 60', valorCaderneta: 0, pagoAte: ''

          <label>Sexo</label>

            <option value="Externo" ${c.tipo==='Externo'?'selected':''}>Externo — paga diretamente ao PT</option>
          </select>

          <label>Serviço (para cálculo de comissão)</label>
          <select id="f_servico">
            ${SERVICOS.map(s => `<option value="${s}" ${c.servico===s?'selected':''}>${s}</option>`).join('')}
          </select>

          <label>Valor da caderneta (€, cobrado a cada renovação)</label>

  // ---------- OVERLAY / MODAL ----------
  function showOverlay(html){
    let ov = root.querySelector('.overlay');
    if(!ov){
      ov = document.createElement('div');
      ov.className = 'overlay';
      root.appendChild(ov);
    }
    ov.innerHTML = html;
    bindOverlayEvents(ov);
  }
  function removeOverlay(){
    const ov = root.querySelector('.overlay');
    if(ov) ov.remove();
  }

  function showModal(){
    let mb = root.querySelector('.modal-backdrop');
    if(mb) mb.remove();
    if(!state.modal) return;
    mb = document.createElement('div');
    mb.className = 'modal-backdrop';
    mb.innerHTML = renderModal(state.modal);
    root.appendChild(mb);
    bindModalEvents(mb);
  }

  function renderModal(modal){
    const c = getClient(modal.id);
    if(modal.type === 'editCaderneta'){
      return `
        <div class="modal-sheet">
          <h3>Editar caderneta anterior</h3>
          <p>Ajustar as datas desta caderneta de ${escapeHtml(c.nome)}. Isto atualiza também a caderneta seguinte/anterior, já que partilham a mesma fronteira.</p>
          <label>Início</label>
          <input type="date" id="m_cadInicio" value="${modal.inicio || ''}">
          <label>Término</label>
          <input type="date" id="m_cadFim" value="${modal.fim || ''}">
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmEditCaderneta">Guardar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'deleteCaderneta'){
      return `
        <div class="modal-sheet">
          <h3>Eliminar caderneta</h3>
          <p>Isto funde esta caderneta de ${escapeHtml(c.nome)} com a caderneta anterior (reverte a renovação/prolongamento que a criou). Os treinos que estavam lá dentro passam a contar na caderneta fundida. Esta ação não pode ser desfeita automaticamente depois de saíres desta ficha.</p>
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmDeleteCaderneta" style="background:var(--coral)">Eliminar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'previewWhatsApp'){
      return `
        <div class="modal-sheet">
          <h3>Pré-visualização da mensagem</h3>
          <p>Podes editar o texto antes de enviar para ${escapeHtml(c.nome)}.</p>
          <textarea id="m_whatsappTexto" rows="5" style="width:100%;box-sizing:border-box;background:var(--bg-card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:14px">${escapeHtml(modal.texto || '')}</textarea>
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-secondary" id="modalRegenerarFrase">🔀 Trocar frase</button>
            <button class="btn btn-primary" id="modalEnviarWhatsApp">Abrir WhatsApp</button>
          </div>
        </div>`;
    }
    if(modal.type === 'notificacaoCadernetas'){
      const expiradas = (modal.expiradasIds||[]).map(id => getClient(id)).filter(Boolean);
      const expirando = (modal.expirandoIds||[]).map(id => getClient(id)).filter(Boolean);
      return `
        <div class="modal-sheet">
          <h3>Cadernetas a acompanhar</h3>
          ${expiradas.length > 0 ? `
            <p style="color:var(--coral);font-weight:700;margin:0 0 6px">Expiradas (${expiradas.length})</p>
            ${expiradas.map(cl => `
              <div class="list-item">
                <span data-open-client="${cl.id}" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted">${escapeHtml(cl.nome)}</span>
                <span class="mono" style="color:var(--coral)">${fmtDateShort(cl.cicloValidade)}</span>
              </div>
            `).join('')}
          ` : ''}
          ${expirando.length > 0 ? `
            <p style="color:var(--amber);font-weight:700;margin:16px 0 6px">A expirar na próxima semana (${expirando.length})</p>
            ${expirando.map(cl => `
              <div class="list-item">
                <span data-open-client="${cl.id}" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted">${escapeHtml(cl.nome)}</span>
                <span style="display:flex;align-items:center;gap:8px">
                  <span class="mono" style="color:var(--amber)">${fmtDateShort(cl.cicloValidade)}</span>
                  ${cl.autoRenovar
                    ? `<span class="badge-inline bday">✓ agendada</span>`
                    : `<button class="btn btn-secondary" data-marcar-renovar="${cl.id}" style="width:auto;padding:5px 12px;font-size:11.5px;margin-top:0">Renovar</button>`
                  }
                </span>
              </div>
            `).join('')}
          ` : ''}
          <p style="color:var(--text-muted);font-size:12px;margin:14px 0 0">A renovação não é automática — só acontece quando confirmares aqui, ou individualmente na ficha de cada cliente. Tocar em "Renovar" numa caderneta ainda não expirada agenda-a para renovar sozinha assim que a data chegar, sem pedir confirmação outra vez.</p>
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Fechar</button>
            ${expiradas.length > 0 ? `<button class="btn btn-primary" id="modalConfirmRenovarTodas">Renovar todas as expiradas</button>` : ''}
          </div>
        </div>`;
    }
    if(modal.type === 'editTreino'){
      const ec = getClient(modal.clientId);
      const t = ec ? (ec.treinos||[]).find(x => x.id === modal.treinoId) : null;
      if(!t) return '';
      const clientesOrdenados = state.clients.slice().sort((a,b) => a.nome.localeCompare(b.nome));
      return `
        <div class="modal-sheet">
          <h3>Editar treino</h3>

          <input type="text" id="m_editTreinoNota" value="${escapeAttr(t.nota||'')}">
          <label>Cliente</label>
          <select id="m_editTreinoCliente">
            ${clientesOrdenados.map(cc => `<option value="${cc.id}" ${cc.id===ec.id?'selected':''}>${escapeHtml(cc.nome)}</option>`).join('')}
          </select>
          ${t.googleEventId ? '<p style="color:var(--text-muted);font-size:12px;margin:10px 0 0">Este treino veio do Google Calendar. Alterações aqui mantêm-se mesmo que voltes a sincronizar — mas se apagares o evento no Calendar, este treino é removido na sincronização seguinte.</p>' : ''}
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmEditTreino">Guardar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'treino'){
      return `
        <div class="modal-sheet">
          <h3>Registar treino</h3>
          <p>Adicionar uma sessão realizada para ${escapeHtml(c.nome)}.</p>
          <label>Data do treino</label>
          <input type="date" id="m_treinoData" value="${todayISO()}">
          <label>Hora (opcional)</label>
          <input type="time" id="m_treinoHora">
          <label>Nota (opcional)</label>
          <input type="text" id="m_treinoNota" placeholder="Ex: treino de força">
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmTreino">Registar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'pagamento' || modal.type === 'editPagamento'){
      const isEditPag = modal.type === 'editPagamento';
      const pagamentoExistente = isEditPag ? (c.pagamentos||[]).find(p => p.id === modal.pagamentoId) : null;
      const valorSugerido = pagamentoExistente ? Number(pagamentoExistente.valor).toFixed(2) : (Number(c.valorCaderneta||0) > 0 ? Number(c.valorCaderneta).toFixed(2) : '');
      const dataSugerida = pagamentoExistente ? pagamentoExistente.data : todayISO();
      const inicioSugerido = pagamentoExistente ? (pagamentoExistente.inicioCadernetaRef || pagamentoExistente.data) : (c.inicioCadernetaAtual || todayISO());
      const cadernetasSugerido = pagamentoExistente ? (pagamentoExistente.cadernetas || 1) : 1;
      const cadernetaRefSugerido = pagamentoExistente ? (pagamentoExistente.cadernetaRef || '') : '';
      const notaSugerida = pagamentoExistente ? (pagamentoExistente.nota || '') : '';
      return `
        <div class="modal-sheet">
          <h3>${isEditPag ? 'Editar pagamento' : 'Registar pagamento'}</h3>
          <p>${isEditPag ? 'Ajustar' : 'Adicionar'} um pagamento para ${escapeHtml(c.nome)}.</p>
          <label>Valor (€)</label>
          <input type="number" id="m_pagValor" placeholder="0.00" step="0.01" value="${valorSugerido}">
          <label>Data do pagamento</label>
          <input type="date" id="m_pagData" value="${dataSugerida}">
          <p style="color:var(--text-muted);font-size:12px;margin:8px 0 0">Quando o dinheiro foi mesmo recebido — só para o teu registo, não decide o mês nos relatórios.</p>
          <label>Início da caderneta a que se refere</label>
          <input type="date" id="m_pagInicioCaderneta" value="${inicioSugerido}">
          <p style="color:var(--text-muted);font-size:12px;margin:8px 0 0">Esta data decide o mês em que o pagamento entra nos relatórios (Nº Pagamentos, Cadernetas Pagas, Sessões Pagas) — mesmo que a data do pagamento seja diferente.</p>
          <label>Nº de cadernetas cobertas por este pagamento</label>
          <input type="number" id="m_pagCadernetas" value="${cadernetasSugerido}" min="1" step="1">
          <p style="color:var(--text-muted);font-size:12px;margin:8px 0 0">Se o pagamento cobrir várias cadernetas de uma vez (ex: 6 pagas adiantado), mete aqui esse número — cada uma conta no mês do seu próprio início, a partir da data acima.</p>
          <label>Nº da(s) caderneta(s) a que se refere (opcional)</label>
          <input type="text" id="m_pagCadernetaRef" placeholder="Ex: 3 ou 4-6" value="${escapeAttr(cadernetaRefSugerido)}">
          <p style="color:var(--text-muted);font-size:12px;margin:8px 0 0">Referência livre, para saberes depois a que cadernetas específicas este pagamento corresponde (vês esta referência na lista de pagamentos).</p>
          <label>Nota (opcional)</label>
          <input type="text" id="m_pagNota" placeholder="Ex: renovação caderneta" value="${escapeAttr(notaSugerida)}">
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmPagamento">${isEditPag ? 'Guardar' : 'Registar'}</button>
          </div>
        </div>`;
    }
    if(modal.type === 'renovar'){
      const newInicio = c.cicloValidade;
      const newValidade = addDays(newInicio, 28);
      return `
        <div class="modal-sheet">
          <h3>Renovar caderneta</h3>
          <p>Novo ciclo de 4 semanas para ${escapeHtml(c.nome)}: de ${fmtDateShort(newInicio)} até ${fmtDateShort(newValidade)}. O contador de treinos reinicia.</p>
          <div class="btn-row">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmRenovar">Confirmar renovação</button>
          </div>
        </div>`;
    }
    if(modal.type === 'prolongar'){
      return `
        <div class="modal-sheet">
          <h3>Prolongar caderneta</h3>
          <p>Usa isto quando o cliente ainda não fez todos os treinos da caderneta atual. A validade é adiada, mas o ciclo e as sessões feitas mantêm-se.</p>
          <label>Prolongar por quantas semanas?</label>
          <input type="number" id="m_prolongarSemanas" value="1" min="1" max="8">
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmProlongar">Confirmar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'deleteClient'){
      return `
        <div class="modal-sheet">
          <h3>Remover cliente</h3>
          <p>Tens a certeza que queres remover ${escapeHtml(c.nome)}? Esta ação não pode ser desfeita.</p>
          <div class="btn-row">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-danger" id="modalConfirmDelete">Remover</button>
          </div>
        </div>`;
    }
    return '';
  }

  // ---------- EVENTS ----------
  function bindMainEvents(){
    const fab = root.querySelector('#fabAdd');
    if(fab) fab.onclick = () => { state.view = 'add'; state.activeId = null; render(); };

    root.querySelectorAll('[data-nav]').forEach(btn => {
      btn.onclick = () => { state.view = btn.dataset.nav; render(); };
    });

    root.querySelectorAll('[data-toggle-mes]').forEach(el => {
      el.onclick = () => {
        const key = el.dataset.toggleMes;
        const idx = state.historicoAbertos.indexOf(key);
        if(idx !== -1){
          state.historicoAbertos.splice(idx, 1); // já estava aberto: fecha
        } else {
          state.historicoAbertos.push(key); // abre; se já houver 2, fecha o mais antigo
          if(state.historicoAbertos.length > 2) state.historicoAbertos.shift();
        }
        render();
      };
    });

    const btnExportHistorico = root.querySelector('#btnExportHistorico');
    if(btnExportHistorico) btnExportHistorico.onclick = () => exportHistoricoExcel();

    root.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = () => { state.view = 'detail'; state.activeId = el.dataset.open; render(); };
    });

    const search = root.querySelector('#searchInput');
    if(search){
      search.oninput = (e) => { state.search = e.target.value; renderListOnly(); };
    }

    root.querySelectorAll('[data-filtertipo]').forEach(btn => {
      btn.onclick = () => { state.filterTipo = btn.dataset.filtertipo; render(); };
    });

    const importExcelFile = root.querySelector('#importExcelFile');
    if(importExcelFile) importExcelFile.onchange = async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      if(typeof XLSX === 'undefined'){
        showToast('Biblioteca de Excel não carregou. Verifica a ligação à internet e tenta de novo.');
        e.target.value = '';
        return;
      }
      try{
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(buf), {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval: null});
        const result = importExcelClients(rows);
        await saveData();
        let msg = `${result.added} cliente(s) adicionado(s)`;
        if(result.skipped) msg += `, ${result.skipped} já existiam (ignorados)`;
        if(result.semNome) msg += `, ${result.semNome} linha(s) sem nome (ignoradas)`;
        showToast(msg);
        render();
      }catch(err){
        console.error(err);
        showToast('Não foi possível ler este ficheiro Excel');
      }
      e.target.value = '';
    };

    root.querySelectorAll('[data-financetab]').forEach(btn => {
      btn.onclick = () => { state.financeTab = btn.dataset.financetab; render(); };
    });

    root.querySelectorAll('[data-monthnav]').forEach(btn => {
      btn.onclick = () => { state.financeMonth = addMonths(state.financeMonth, parseInt(btn.dataset.monthnav)); render(); };
    });

    const btnExportRelatorio = root.querySelector('#btnExportRelatorio');
    if(btnExportRelatorio) btnExportRelatorio.onclick = () => exportRelatorioExcel();

    const btnSaveGoogleClientId = root.querySelector('#btnSaveGoogleClientId');
    if(btnSaveGoogleClientId) btnSaveGoogleClientId.onclick = () => {
      const val = root.querySelector('#googleClientIdInput').value.trim();
      if(!val){ showToast('Cola o Client ID primeiro'); return; }
      saveGoogleClientId(val);
    };

    const btnConnectGoogle = root.querySelector('#btnConnectGoogle');
    if(btnConnectGoogle) btnConnectGoogle.onclick = () => connectGoogleCalendar();

    const btnSyncAllGoogle = root.querySelector('#btnSyncAllGoogle');
    if(btnSyncAllGoogle) btnSyncAllGoogle.onclick = () => syncAllClientsToGoogleCalendar();

    const googleTrainingColorInput = root.querySelector('#googleTrainingColorInput');
    if(googleTrainingColorInput) googleTrainingColorInput.onchange = (e) => saveGoogleTrainingColor(e.target.value);

    const btnImportTreinosGoogle = root.querySelector('#btnImportTreinosGoogle');
    if(btnImportTreinosGoogle) btnImportTreinosGoogle.onclick = () => {
      const days = parseInt(root.querySelector('#googleImportDays').value) || 60;
      importTreinosFromGoogleCalendar(days);
    };

    const btnDisconnectGoogle = root.querySelector('#btnDisconnectGoogle');
    if(btnDisconnectGoogle) btnDisconnectGoogle.onclick = () => disconnectGoogleCalendar();


    const btnSyncNew = root.querySelector('#btnSyncNew');
    if(btnSyncNew) btnSyncNew.onclick = () => connectSyncFile(true);

    const btnSyncExisting = root.querySelector('#btnSyncExisting');
    if(btnSyncExisting) btnSyncExisting.onclick = () => connectSyncFile(false);

    const btnSyncReauth = root.querySelector('#btnSyncReauth');
    if(btnSyncReauth) btnSyncReauth.onclick = () => reauthorizeSyncFile();

    const btnSyncDisconnect = root.querySelector('#btnSyncDisconnect');
    if(btnSyncDisconnect) btnSyncDisconnect.onclick = () => disconnectSyncFile();

    const exportBtn = root.querySelector('#btnExport');
    if(exportBtn) exportBtn.onclick = () => {
      const blob = new Blob([JSON.stringify(state.clients, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pt_clientes_backup_${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Backup descarregado');
    };

    const importFile = root.querySelector('#importFile');
    if(importFile) importFile.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try{
          const parsed = JSON.parse(ev.target.result);
          if(!Array.isArray(parsed)) throw new Error('formato inválido');
          state.clients = parsed.map(migrateClient);
          await saveData();
          showToast('Dados importados com sucesso');
          render();
        }catch(err){
          showToast('Ficheiro inválido. Tem de ser um backup exportado por esta app.');
        }
      };
      reader.readAsText(file);
    };
  }

  function renderListOnly(){
    const contentEl = root.querySelector('.content');
    if(contentEl && state.view === 'list'){
      contentEl.innerHTML = renderList();
      root.querySelectorAll('[data-open]').forEach(el => {
        el.onclick = () => { state.view = 'detail'; state.activeId = el.dataset.open; render(); };
      });
    }
  }

  function bindOverlayEvents(ov){
    const back = ov.querySelector('#backBtn');
    if(back) back.onclick = () => { state.view = 'list'; state.activeId = null; render(); };

    const editBtn = ov.querySelector('#editBtn');
    if(editBtn) editBtn.onclick = () => { state.view = 'edit'; render(); };

    const btnPreviewWhatsApp = ov.querySelector('#btnPreviewWhatsApp');
    if(btnPreviewWhatsApp) btnPreviewWhatsApp.onclick = () => {
      const c = getClient(state.activeId);
      const texto = buildLembreteTreinoTexto(c);
      state.modal = { type: 'previewWhatsApp', id: state.activeId, texto };
      showModal();
    };

    const btnTreino = ov.querySelector('#btnRegistarTreino');
    if(btnTreino) btnTreino.onclick = () => { state.modal = {type:'treino', id: state.activeId}; showModal(); };

    const btnRenovar = ov.querySelector('#btnRenovar');
    if(btnRenovar) btnRenovar.onclick = () => { state.modal = {type:'renovar', id: state.activeId}; showModal(); };

    const btnProlongar = ov.querySelector('#btnProlongar');
    if(btnProlongar) btnProlongar.onclick = () => { state.modal = {type:'prolongar', id: state.activeId}; showModal(); };

    const btnAddPag = ov.querySelector('#btnAddPagamento');
    if(btnAddPag) btnAddPag.onclick = () => { state.modal = {type:'pagamento', id: state.activeId}; showModal(); };

    const btnDelete = ov.querySelector('#btnDeleteClient');
    if(btnDelete) btnDelete.onclick = () => { state.modal = {type:'deleteClient', id: state.activeId}; showModal(); };

    ov.querySelectorAll('[data-undo-entry]').forEach(btn => {
      btn.onclick = async () => {
        const c = getClient(state.activeId);
        const ok = undoSpecificChange(c, btn.dataset.undoEntry);
        if(ok){
          await saveData();
          showToast('Alteração desfeita');
          render();
        }
      };
    });

    ov.querySelectorAll('[data-edit-treino]').forEach(el => {
      el.onclick = () => { state.modal = { type: 'editTreino', clientId: state.activeId, treinoId: el.dataset.editTreino }; showModal(); };
    });

    ov.querySelectorAll('[data-edit-caderneta]').forEach(el => {
      el.onclick = () => {
        const [inicio, fim, emCurso] = el.dataset.editCaderneta.split('|');
        state.modal = { type: 'editCaderneta', id: state.activeId, inicio: inicio || '', fim: fim || '', emCurso: emCurso === '1' };
        showModal();
      };
    });

    ov.querySelectorAll('[data-del-caderneta]').forEach(el => {
      el.onclick = () => {
        const [inicio, emCurso] = el.dataset.delCaderneta.split('|');
        state.modal = { type: 'deleteCaderneta', id: state.activeId, inicio: inicio || '', emCurso: emCurso === '1' };
        showModal();
      };
    });

    ov.querySelectorAll('[data-del-treino]').forEach(b => {
      b.onclick = async () => {
        const c = getClient(state.activeId);
        c.treinos = (c.treinos||[]).filter(t => t.id !== b.dataset.delTreino);
        await saveData();
        render();
      };
    });
    ov.querySelectorAll('[data-del-pag]').forEach(b => {
      b.onclick = async () => {
        const c = getClient(state.activeId);
        c.pagamentos = (c.pagamentos||[]).filter(p => p.id !== b.dataset.delPag);
        await saveData();
        render();
      };
    });
    ov.querySelectorAll('[data-edit-pag]').forEach(b => {
      b.onclick = () => {
        state.modal = { type: 'editPagamento', id: state.activeId, pagamentoId: b.dataset.editPag };
        showModal();
      };
    });

    const saveBtn = ov.querySelector('#btnSaveClient');
    if(saveBtn) saveBtn.onclick = async () => {
      const nome = ov.querySelector('#f_nome').value.trim();
      if(!nome){ showToast('O nome é obrigatório'); return; }
      const data = {
        nome,
        sexo: ov.querySelector('#f_sexo').value,
        nascimento: ov.querySelector('#f_nascimento').value,
        contacto: ov.querySelector('#f_contacto').value.trim(),
        email: ov.querySelector('#f_email').value.trim(),
        atividade: ov.querySelector('#f_atividade').value.trim(),
        sessoesEsperadas: parseInt(ov.querySelector('#f_sessoes').value) || 4,
        cicloInicio: ov.querySelector('#f_inicio').value || todayISO(),
        cicloValidade: ov.querySelector('#f_validade').value || addDays(todayISO(),28),
        inicioCadernetaAtual: ov.querySelector('#f_inicioCaderneta').value || addDays(ov.querySelector('#f_validade').value || todayISO(), -28),
        tipo: ov.querySelector('#f_tipo').value,
        servico: ov.querySelector('#f_servico').value,
        valorCaderneta: parseFloat(ov.querySelector('#f_valorCaderneta').value) || 0,
        pagoAte: ov.querySelector('#f_pagoAte').value || '',
        concentrarComprasNoMes: ov.querySelector('#f_concentrarComprasNoMes') ? ov.querySelector('#f_concentrarComprasNoMes').checked : false,
      };
      if(state.view === 'edit'){
        const c = getClient(state.activeId);
        const changes = [];
        Object.keys(data).forEach(key => {
          if(JSON.stringify(c[key]) !== JSON.stringify(data[key])){
            changes.push({ campo: key, rotulo: CAMPO_LABELS[key] || key, antes: c[key], depois: data[key] });
          }
        });
        if(changes.length) logChange(c, 'Edição de ficha', changes);
        Object.assign(c, data);
        await saveData();
        showToast('Alterações guardadas');
        state.view = 'detail';
      } else {
        const nc = { id: uid(), treinos: [], pagamentos: [], historico: [], ativo: true, ...data };
        state.clients.push(nc);
        await saveData();
        showToast('Cliente adicionado');
        state.activeId = nc.id;
        state.view = 'detail';
      }
      render();
    };

    // auto-suggest sessions when atividade changes on add/edit form
    const atividadeInput = ov.querySelector('#f_atividade');
    if(atividadeInput){
      atividadeInput.addEventListener('blur', () => {
        const sessoesInput = ov.querySelector('#f_sessoes');
        if(sessoesInput && !sessoesInput.dataset.touched){
          sessoesInput.value = parseSessions(atividadeInput.value);
        }
      });
      const sessoesInput = ov.querySelector('#f_sessoes');
      if(sessoesInput) sessoesInput.addEventListener('input', () => sessoesInput.dataset.touched = '1');
    }

    // mostra a opção "concentrar compras no mês" só quando o Tipo é Externo
    const tipoSelect = ov.querySelector('#f_tipo');
    const concentrarWrap = ov.querySelector('#f_concentrarWrap');
    if(tipoSelect && concentrarWrap){
      tipoSelect.addEventListener('change', () => {
        concentrarWrap.style.display = tipoSelect.value === 'Externo' ? 'block' : 'none';
      });
    }

    // auto-suggest valor da caderneta a partir do serviço (PT 60 = 34€/sessão, PT 30 = 23€/sessão)
    const servicoInput = ov.querySelector('#f_servico');
    const valorCadernetaInput = ov.querySelector('#f_valorCaderneta');
    const sessoesInputForValor = ov.querySelector('#f_sessoes');
    if(valorCadernetaInput){
      valorCadernetaInput.addEventListener('input', () => valorCadernetaInput.dataset.touched = '1');
      const trySuggestValor = () => {
        if(valorCadernetaInput.dataset.touched) return;
        const servico = servicoInput ? servicoInput.value : null;
        const sessoes = parseInt(sessoesInputForValor ? sessoesInputForValor.value : 0) || 0;
        const sugestao = suggestValorCaderneta(servico, sessoes);
        if(sugestao !== null) valorCadernetaInput.value = sugestao;
      };
      if(servicoInput) servicoInput.addEventListener('change', trySuggestValor);
      if(sessoesInputForValor) sessoesInputForValor.addEventListener('input', trySuggestValor);
    }
  }

  function bindModalEvents(mb){
    const cancel = mb.querySelector('#modalCancel');
    if(cancel) cancel.onclick = () => { state.modal = null; showModal(); };

    const confirmRenovarTodas = mb.querySelector('#modalConfirmRenovarTodas');
    if(confirmRenovarTodas) confirmRenovarTodas.onclick = async () => {
      const ids = state.modal.expiradasIds || [];
      await renewAllExpiredClients(ids);
      state.modal = null;
      showToast(`${ids.length} caderneta(s) renovada(s)`);
      render();
    };

    // ao inserir o nº da caderneta, sugere automaticamente o início real dessa caderneta
    // (mas nunca sobrepõe uma data que o utilizador já tenha escolhido à mão)
    const m_pagCadernetaRef = mb.querySelector('#m_pagCadernetaRef');
    const m_pagInicioCaderneta = mb.querySelector('#m_pagInicioCaderneta');
    if(m_pagCadernetaRef && m_pagInicioCaderneta){
      m_pagCadernetaRef.addEventListener('input', () => {
        if(m_pagInicioCaderneta.dataset.touched) return;
        const numeroMatch = m_pagCadernetaRef.value.match(/\d+/);
        if(!numeroMatch) return;
        const c = getClient(state.modal.id);
        const inicioSugerido = getCadernetaInicioPorNumero(c, parseInt(numeroMatch[0]));
        if(inicioSugerido) m_pagInicioCaderneta.value = inicioSugerido;
      });
      m_pagInicioCaderneta.addEventListener('input', () => { m_pagInicioCaderneta.dataset.touched = '1'; });
    }

    const modalRegenerarFrase = mb.querySelector('#modalRegenerarFrase');
    if(modalRegenerarFrase) modalRegenerarFrase.onclick = () => {
      const c = getClient(state.modal.id);
      state.modal.texto = buildLembreteTreinoTexto(c);
      showModal();
    };

    const modalEnviarWhatsApp = mb.querySelector('#modalEnviarWhatsApp');
    if(modalEnviarWhatsApp) modalEnviarWhatsApp.onclick = () => {
      const c = getClient(state.modal.id);
      const texto = mb.querySelector('#m_whatsappTexto').value;
      const link = buildWhatsAppLink(c, texto);
      if(link){
        window.open(link, '_blank');
        state.modal = null;
        render();
      } else {
        showToast('Este cliente não tem contacto guardado');
      }
    };

    const confirmEditCaderneta = mb.querySelector('#modalConfirmEditCaderneta');
    if(confirmEditCaderneta) confirmEditCaderneta.onclick = async () => {
      const c = getClient(state.modal.id);
      const inicioAntigo = state.modal.inicio;
      const fimAntigo = state.modal.fim;
      const emCurso = state.modal.emCurso;
      const novoInicio = mb.querySelector('#m_cadInicio').value;
      const novoFim = mb.querySelector('#m_cadFim').value;
      if(!novoInicio || !novoFim || novoFim <= novoInicio){
        showToast('Datas inválidas: o término tem de ser depois do início');
        return;
      }
      const changes = [];
      c.cadernetaBoundariesConfirmadas = c.cadernetaBoundariesConfirmadas || [];
      if(inicioAntigo && novoInicio !== inicioAntigo){
        updateInicioCadernetaBoundary(c, inicioAntigo, novoInicio);
        changes.push({ campo: 'inicioCadernetaAtual', rotulo: 'Início da Caderneta (editada)', antes: inicioAntigo, depois: novoInicio });
        if(!c.cadernetaBoundariesConfirmadas.includes(novoInicio)) c.cadernetaBoundariesConfirmadas.push(novoInicio);
      }
      if(fimAntigo && novoFim !== fimAntigo){
        // O término da caderneta ATUAL vive em cicloValidade; o das anteriores vive em
        // inicioCadernetaAtual (é o início da caderneta seguinte).
        if(emCurso){
          updateCicloValidadeBoundary(c, fimAntigo, novoFim);
          changes.push({ campo: 'cicloValidade', rotulo: 'Válida até (editada)', antes: fimAntigo, depois: novoFim });
        } else {
          updateInicioCadernetaBoundary(c, fimAntigo, novoFim);
          changes.push({ campo: 'inicioCadernetaAtual', rotulo: 'Término da Caderneta (editado)', antes: fimAntigo, depois: novoFim });
        }
        if(!c.cadernetaBoundariesConfirmadas.includes(novoFim)) c.cadernetaBoundariesConfirmadas.push(novoFim);
      }
      if(changes.length > 0){
        logChange(c, 'Edição de caderneta anterior', changes);
        await saveData();
        showToast('Caderneta atualizada');
      }
      state.modal = null;
      render();
    };

    const confirmDeleteCaderneta = mb.querySelector('#modalConfirmDeleteCaderneta');
    if(confirmDeleteCaderneta) confirmDeleteCaderneta.onclick = async () => {
      const c = getClient(state.modal.id);
      const inicio = state.modal.inicio;
      const emCurso = state.modal.emCurso;
      if(emCurso){
        // a caderneta em curso corresponde sempre à alteração mais recente do histórico;
        // desfazê-la reverte os campos ao vivo para o estado anterior (correto neste caso).
        if(c.historico && c.historico.length > 0){
          undoSpecificChange(c, c.historico[0].id);
        }
      } else {
        // Se existir uma entrada no histórico que criou esta fronteira, reconecta-a (para
        // não deixar referências soltas), mas a exclusão funciona sempre — mesmo quando a
        // fronteira nunca teve uma ação registada (ex: veio da importação inicial).
        const idx = (c.historico||[]).findIndex(h => (h.changes||[]).some(ch => ch.campo === 'inicioCadernetaAtual' && ch.depois === inicio));
        if(idx !== -1){
          const change = c.historico[idx].changes.find(ch => ch.campo === 'inicioCadernetaAtual' && ch.depois === inicio);
          const valorAnterior = change.antes;
          c.historico.splice(idx, 1);
          (c.historico||[]).forEach(h => (h.changes||[]).forEach(ch => {
            if(ch.campo === 'inicioCadernetaAtual' && ch.antes === inicio) ch.antes = valorAnterior;
          }));
        }
        c.cadernetaBoundariesRemovidas = c.cadernetaBoundariesRemovidas || [];
        const antesArray = c.cadernetaBoundariesRemovidas.slice();
        if(!c.cadernetaBoundariesRemovidas.includes(inicio)) c.cadernetaBoundariesRemovidas.push(inicio);
        logChange(c, `Eliminação de caderneta (início ${fmtDateShort(inicio)}, fundida com a anterior)`, [
          { campo: 'cadernetaBoundariesRemovidas', rotulo: 'Cadernetas eliminadas', antes: antesArray, depois: c.cadernetaBoundariesRemovidas.slice() }
        ]);
      }
      await saveData();
      showToast('Caderneta eliminada — fundida com a anterior');
      state.modal = null;
      render();
    };

    mb.querySelectorAll('[data-marcar-renovar]').forEach(btn => {
      btn.onclick = async () => {
        const cl = getClient(btn.dataset.marcarRenovar);
        if(cl){
          cl.autoRenovar = true;
          await saveData();
          showToast(`${cl.nome.split(' ')[0]}: renovação agendada`);
          showModal(); // volta a desenhar o mesmo modal, agora com "✓ agendada"
        }
      };
    });

    mb.querySelectorAll('[data-open-client]').forEach(el => {
      el.onclick = () => {
        state.modal = null;
        state.view = 'detail';
        state.activeId = el.dataset.openClient;
        render();
      };
    });

    const confirmEditTreino = mb.querySelector('#modalConfirmEditTreino');
    if(confirmEditTreino) confirmEditTreino.onclick = async () => {
      const oldClient = getClient(state.modal.clientId);
      const treino = (oldClient.treinos||[]).find(t => t.id === state.modal.treinoId);
      if(!treino){ state.modal = null; render(); return; }
      const novaData = mb.querySelector('#m_editTreinoData').value || treino.data;
      const novaHora = mb.querySelector('#m_editTreinoHora').value || '';
      const novaNota = mb.querySelector('#m_editTreinoNota').value.trim();
      const novoClienteId = mb.querySelector('#m_editTreinoCliente').value;
      treino.data = novaData;
      treino.hora = novaHora;
      treino.nota = novaNota;
      if(novoClienteId !== oldClient.id){
        oldClient.treinos = oldClient.treinos.filter(t => t.id !== treino.id);
        const newClient = getClient(novoClienteId);
        newClient.treinos = newClient.treinos || [];
        newClient.treinos.push(treino);
        state.activeId = novoClienteId;
      }
      await saveData();
      state.modal = null;
      showToast('Treino atualizado');
      render();
    };

    const confirmTreino = mb.querySelector('#modalConfirmTreino');
    if(confirmTreino) confirmTreino.onclick = async () => {
      const c = getClient(state.modal.id);
      const data = mb.querySelector('#m_treinoData').value || todayISO();
      const hora = mb.querySelector('#m_treinoHora').value || '';
      const nota = mb.querySelector('#m_treinoNota').value.trim();
      c.treinos = c.treinos || [];
      c.treinos.push({id: uid(), data, hora, nota});
      await saveData();
      state.modal = null;
      showToast('Treino registado');
      render();
    };

    const confirmPag = mb.querySelector('#modalConfirmPagamento');
    if(confirmPag) confirmPag.onclick = async () => {
      const c = getClient(state.modal.id);
      const valor = parseFloat(mb.querySelector('#m_pagValor').value) || 0;
      const data = mb.querySelector('#m_pagData').value || todayISO();
      const inicioCadernetaRef = mb.querySelector('#m_pagInicioCaderneta').value || data;
      const cadernetas = parseInt(mb.querySelector('#m_pagCadernetas').value) || 1;
      const cadernetaRef = mb.querySelector('#m_pagCadernetaRef').value.trim();
      const nota = mb.querySelector('#m_pagNota').value.trim();
      c.pagamentos = c.pagamentos || [];
      if(state.modal.type === 'editPagamento'){
        const p = c.pagamentos.find(p => p.id === state.modal.pagamentoId);
        if(p){
          p.valor = valor; p.data = data; p.inicioCadernetaRef = inicioCadernetaRef;
          p.cadernetas = cadernetas; p.cadernetaRef = cadernetaRef; p.nota = nota;
        }
        await saveData();
        state.modal = null;
        showToast('Pagamento atualizado');
        render();
      } else {
        c.pagamentos.push({id: uid(), valor, data, inicioCadernetaRef, cadernetas, cadernetaRef, nota});
        await saveData();
        state.modal = null;
        showToast('Pagamento registado');
        render();
      }
    };

    const confirmRenovar = mb.querySelector('#modalConfirmRenovar');
    if(confirmRenovar) confirmRenovar.onclick = async () => {
      const c = getClient(state.modal.id);
      const antesInicioCaderneta = inicioCaderneta(c), antesValidade = c.cicloValidade;
      const novoInicioCaderneta = c.cicloValidade;
      const novaValidade = addDays(novoInicioCaderneta, 28);
      logChange(c, 'Renovação de caderneta', [
        { campo: 'inicioCadernetaAtual', rotulo: 'Início da Caderneta', antes: antesInicioCaderneta, depois: novoInicioCaderneta },
        { campo: 'cicloValidade', rotulo: 'Validade', antes: antesValidade, depois: novaValidade }
      ]);
      c.inicioCadernetaAtual = novoInicioCaderneta;
      c.cicloValidade = novaValidade;
      if(c.googleEventId && googleAuth.token) await syncClientToGoogleCalendar(c);
      await saveData();
      state.modal = null;
      showToast('Caderneta renovada');
      render();
    };

    const confirmProlongar = mb.querySelector('#modalConfirmProlongar');
    if(confirmProlongar) confirmProlongar.onclick = async () => {
      const c = getClient(state.modal.id);
      const semanas = parseInt(mb.querySelector('#m_prolongarSemanas').value) || 1;
      const antes = c.cicloValidade;
      const nova = addDays(c.cicloValidade, semanas*7);
      logChange(c, `Prolongamento (+${semanas} semana(s))`, [
        { campo: 'cicloValidade', rotulo: 'Validade', antes, depois: nova }
      ]);
      c.cicloValidade = nova;
      if(c.googleEventId && googleAuth.token) await syncClientToGoogleCalendar(c);
      await saveData();
      state.modal = null;
      showToast(`Caderneta prolongada por ${semanas} semana(s)`);
      render();
    };


    const confirmDelete = mb.querySelector('#modalConfirmDelete');
    if(confirmDelete) confirmDelete.onclick = async () => {
      state.clients = state.clients.filter(c => c.id !== state.modal.id);
      await saveData();
      state.modal = null;
      state.view = 'list';
      state.activeId = null;
      showToast('Cliente removido');
      render();
    };
  }

  function escapeHtml(s){
    return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // Deslizar para o lado nos três separadores principais avança/recua entre eles
  // (Dashboard <-> Clientes <-> Finanças), tal como um app nativo no Android.
  (function setupSwipeNav(){
    const ORDEM_SEPARADORES = ['dashboard', 'list', 'financas', 'historico'];
    let touchStartX = 0, touchStartY = 0, touchActive = false;
    root.addEventListener('touchstart', (e) => {
      if(e.touches.length !== 1) return;
      touchActive = ORDEM_SEPARADORES.includes(state.view) || state.view === 'detail';
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    root.addEventListener('touchend', (e) => {
      if(!touchActive) return;
      touchActive = false;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // não é um deslize horizontal claro

      if(state.view === 'detail'){
        const list = getVisibleClientsOrdered();
        const idx = list.findIndex(c => c.id === state.activeId);
        if(dx < 0){ // deslizar para a esquerda: cliente seguinte, ou volta à lista se for o último
          if(idx !== -1 && idx < list.length - 1){
            state.activeId = list[idx + 1].id;
            render();
          } else {
            state.view = 'list';
            state.activeId = null;
            render();
          }
        } else { // deslizar para a direita: cliente anterior
          if(idx > 0){
            state.activeId = list[idx - 1].id;
            render();
          }
        }
        return;
      }

      const idx = ORDEM_SEPARADORES.indexOf(state.view);
      if(idx === -1) return;
      if(dx < 0 && idx < ORDEM_SEPARADORES.length - 1){
        state.view = ORDEM_SEPARADORES[idx + 1];
        render();
      } else if(dx > 0 && idx > 0){
        state.view = ORDEM_SEPARADORES[idx - 1];
        render();
      }
    }, { passive: true });
  })();

  initGoogleAuth();
  loadData().then(() => tryAutoConnectGoogle());
})();
</script>

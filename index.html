<body>
<div id="pt-app-root"></div>
<style>
  #pt-app-root, #pt-app-root * { box-sizing: border-box; }
  #pt-app-root {
    --bg: #0f1115;
    --surface: #191c22;
    --surface2: #232732;
    --surface3: #2c313d;
    --line: #303643;
    --text: #eef1f5;
    --text-muted: #8a92a6;
    --text-dim: #5b6274;
    --lime: #d4ff3f;
    --lime-dim: #9fbf2f;
    --coral: #ff6b4a;
    --coral-dim: #4a2620;
    --amber: #ffb84a;
    --amber-dim: #4a3a20;
    --ok: #4ade80;
    --app-max-width: 480px;

    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    position: relative;
    padding-bottom: 88px;
    max-width: var(--app-max-width);
    margin: 0 auto;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  /* Em ecrãs largos (PC), a app deixa de ficar espremida numa coluna estreita —
     acompanha a largura real da janela (fluido), com um limite máximo generoso. */
  @media (min-width: 860px) {
    #pt-app-root { --app-max-width: min(94vw, 1400px); }
  }
  #pt-app-root .mono {
    font-family: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
  }
  #pt-app-root .display {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  #pt-app-root .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lime);
    font-weight: 600;
  }

  /* Top bar */
  #pt-app-root .topbar {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    padding: 20px 18px 10px;
  }
  #pt-app-root .topbar h1 {
    font-size: 22px; margin: 4px 0 0; color: var(--text);
  }
  #pt-app-root .search-box {
    margin-top: 12px; position: relative;
  }
  #pt-app-root .search-box input {
    width: 100%; background: var(--surface2); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px 14px; font-size: 15px;
  }
  #pt-app-root .search-box input:focus { outline: 2px solid var(--lime); outline-offset: -1px; }
  #pt-app-root .search-box input::placeholder { color: var(--text-dim); }

  /* Content */
  #pt-app-root .content { padding: 4px 18px 24px; }
  #pt-app-root .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); font-weight: 700; margin: 22px 0 10px;
  }
  #pt-app-root .empty-state {
    color: var(--text-dim); font-size: 14px; padding: 18px 4px; text-align: center;
    border: 1px dashed var(--line); border-radius: 12px;
  }

  /* Alert cards (dashboard) */
  #pt-app-root .alert-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center;
    gap: 12px; cursor: pointer; border-left: 3px solid var(--line);
  }
  #pt-app-root .alert-card.urgent { border-left-color: var(--coral); }
  #pt-app-root .alert-card.soon { border-left-color: var(--amber); }
  #pt-app-root .alert-card.bday { border-left-color: var(--lime); }
  #pt-app-root .alert-card .name { font-weight: 600; font-size: 14.5px; }
  #pt-app-root .alert-card .meta { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
  #pt-app-root .alert-card .tag {
    margin-left: auto; font-family: ui-monospace, monospace; font-size: 11px;
    padding: 4px 8px; border-radius: 20px; white-space: nowrap; font-weight: 600;
  }
  #pt-app-root .tag.urgent { background: var(--coral-dim); color: var(--coral); }
  #pt-app-root .tag.soon { background: var(--amber-dim); color: var(--amber); }
  #pt-app-root .tag.bday { background: rgba(212,255,63,0.12); color: var(--lime); }

  /* Client list cards */
  #pt-app-root .client-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 10px; cursor: pointer; position: relative;
    border-left: 3px solid var(--text-dim);
  }
  #pt-app-root .client-card.status-ok { border-left-color: var(--ok); }
  #pt-app-root .client-card.status-soon { border-left-color: var(--amber); }
  #pt-app-root .client-card.status-expired { border-left-color: var(--coral); }
  #pt-app-root .client-card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #pt-app-root .client-card .name { font-weight: 700; font-size: 15.5px; }
  #pt-app-root .client-code {
    font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; color: var(--text-dim);
  }
  #pt-app-root .client-card .validade { font-size: 11.5px; color: var(--text-muted); font-family: ui-monospace, monospace; white-space: nowrap; }
  #pt-app-root .client-card .atividade { color: var(--text-muted); font-size: 13px; margin-top: 3px; }
  #pt-app-root .stamps { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  #pt-app-root .stamp {
    width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--line);
    background: transparent; flex-shrink: 0;
  }
  #pt-app-root .stamp.filled { background: var(--lime); border-color: var(--lime); }
  #pt-app-root .stamp.extra { background: var(--amber); border-color: var(--amber); }
  #pt-app-root .stamps-label { font-size: 11px; color: var(--text-dim); margin-left: 4px; font-family: ui-monospace, monospace; }

  /* Bottom nav */
  #pt-app-root .bottomnav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: var(--app-max-width); background: var(--surface);
    border-top: 1px solid var(--line); display: flex; z-index: 30;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  #pt-app-root .navbtn {
    flex: 1; background: none; border: none; color: var(--text-dim); font-size: 11px;
    padding: 8px 4px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-weight: 600; letter-spacing: 0.02em;
  }
  #pt-app-root .navbtn.active { color: var(--lime); background: rgba(212,255,63,0.08); }
  #pt-app-root .navbtn svg { width: 20px; height: 20px; }

  #pt-app-root .fab {
    position: fixed; bottom: 78px; left: 50%;
    --fab-offset: 190px;
    transform: translateX(calc(-50% + var(--fab-offset)));
    width: 52px; height: 52px; border-radius: 50%; background: var(--lime);
    color: #12140c; border: none; font-size: 26px; font-weight: 700; z-index: 30;
    box-shadow: 0 6px 18px rgba(212,255,63,0.3); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  /* mantém o botão "+" alinhado com a mesma posição relativa da barra inferior,
     agora que a largura é fluida (proporção igual à original: 190/480) */
  @media (min-width: 860px) {
    #pt-app-root .fab { --fab-offset: calc(var(--app-max-width) * 0.3958); }
  }

  /* Detail / form overlay */
  #pt-app-root .overlay {
    position: fixed; top: 0; bottom: 0; background: var(--bg); z-index: 50;
    width: 100%; max-width: var(--app-max-width); overflow-y: auto; padding-bottom: 40px;
    left: 50%; transform: translateX(-50%);
  }
  #pt-app-root .overlay-header {

<script>
(function(){
  const SEED_CLIENTS = [];

  const STORE_KEY = 'pt_clients_v1';
  const root = document.getElementById('pt-app-root');

  let state = {
    clients: [],
    view: 'dashboard', // dashboard | list | detail | add | edit | financas
    search: '',
    filterTipo: 'all', // all | Interno | Externo
    activeId: null,
    loaded: false,
    modal: null, // {type, id}
    financeTab: 'treinos', // treinos | receita
    financeMonth: null, // 'YYYY-MM', set on load
    historicoAberto: null, // mantido por compatibilidade, não usado
    historicoAbertos: [], // até 2 meses abertos em simultâneo no separador Histórico
  };

  const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const MON_FULL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // Tabela de comissões (PT interno recebe do ginásio; PT externo paga comissão ao ginásio)
  const COMISSOES = {
    'Coach Training':    { baixo: 20.00, alto: 22.00, externo: 10.00 },
    'PT Pilates Ind.':   { baixo: 20.00, alto: 22.00, externo: 12.50 },
    'PT Pilates Group':  { baixo: 17.00, alto: 19.00, externo: 10.80 },
    'Mat Pilates':       { baixo: 5.00,  alto: 6.00,  externo: null  },
    'PT 60':             { baixo: 17.00, alto: 19.00, externo: 10.80 },
    'PT 30':             { baixo: 11.50, alto: 13.50, externo: 7.80 },
    'PT Group 60':       { baixo: 11.50, alto: 13.50, externo: 7.80 },
    'PT Group 30':       { baixo: 9.00,  alto: 10.50, externo: 5.80 },
  };
  const SERVICOS = Object.keys(COMISSOES);
  const PATAMAR_INTERNO = 80;   // treinos combinados (interno+externo) no mês
  const ISENCAO_EXTERNO = 100;  // treinos externos no mês, isentos os de menor valor primeiro

  // Preço por sessão cobrado ao cliente (coluna "Valor 12 Semanas" da tabela de comissões 2026)
  const VALOR_SESSAO_CLIENTE = {
    'Coach Training':   40.00,
    'PT Pilates Ind.':  40.00,
    'PT Pilates Group': 34.00,
    'PT 60':            34.00,
    'PT 30':            23.00,
    'PT Group 60':      23.00,
    'PT Group 30':      18.00,
    // Mat Pilates fica de fora: a tabela original tem "Variável", sem valor fixo
  };
  function suggestValorCaderneta(servico, sessoesEsperadas){
    const preco = VALOR_SESSAO_CLIENTE[servico];
    if(!preco) return null;
    return Math.round(preco * (sessoesEsperadas||0) * 100) / 100;
  }

  function guessServico(atividade){
    const a = (atividade||'').toLowerCase();
    const is30 = a.includes('30 min') || a.includes('30 minutos');
    const isGroup = a.includes('group');
    if(isGroup) return is30 ? 'PT Group 30' : 'PT Group 60';
    if(a.includes('pilates')) return isGroup ? 'PT Pilates Group' : 'PT Pilates Ind.';
    return is30 ? 'PT 30' : 'PT 60';
  }

  // ---------- IMPORTAÇÃO DE EXCEL ----------
  function normHeader(h){
    return String(h||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  }
  function getField(row, candidates){
    const keys = Object.keys(row);
    for(const k of keys){
      const nk = normHeader(k);
      if(candidates.includes(nk)) return row[k];
    }
    return null;
  }
  function excelDateToIso(v){
    if(v === null || v === undefined || v === '') return '';
    if(v instanceof Date){
      const y = v.getUTCFullYear(), m = v.getUTCMonth()+1, d = v.getUTCDate();
      return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    return '';
  }
  function importExcelClients(rows){
    let added = 0, skipped = 0, semNome = 0;
    rows.forEach(row => {
      const nome = getField(row, ['nome']);
      if(!nome || !String(nome).trim()){ semNome++; return; }
      const codigo = getField(row, ['codigo']);
      const id = (codigo !== null && codigo !== undefined && String(codigo).trim() !== '') ? String(codigo).trim() : uid();
      if(getClient(id)){ skipped++; return; }

      const atividade = String(getField(row, ['atividade']) || '').trim();
      const nascimento = excelDateToIso(getField(row, ['nascimento']));
      const cicloInicio = excelDateToIso(getField(row, ['inicio'])) || todayISO();
      const cicloValidade = excelDateToIso(getField(row, ['validade'])) || addDays(cicloInicio, 28);
      const valorCliente = parseFloat(getField(row, ['valor cliente','valorcliente'])) || 0;
      const statusVal = String(getField(row, ['status']) || '').trim();
      const sexoRaw = String(getField(row, ['sexo']) || 'F').trim().toUpperCase();
      const contacto = getField(row, ['contacto','telefone','telemovel']);
      const email = getField(row, ['email','e-mail']);

      state.clients.push({
        id,
        nome: String(nome).trim(),
        sexo: sexoRaw.startsWith('M') ? 'M' : 'F',
        nascimento,
        contacto: contacto ? String(contacto).trim() : '',
        email: email ? String(email).trim() : '',
        atividade,
        sessoesEsperadas: parseSessions(atividade),
        cicloInicio, cicloValidade,
        tipo: 'Interno',
        servico: guessServico(atividade),
        valorCaderneta: valorCliente,
        treinos: [], pagamentos: [],
        ativo: statusVal.includes('Activo'),
        status: statusVal
      });
      added++;
    });
    return { added, skipped, semNome };
  }

  function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
  // Constrói "AAAA-MM-DD" a partir da hora LOCAL do dispositivo, nunca via toISOString()
  // (que converte para UTC e pode fazer recuar um dia inteiro em fusos horários como
  // o de Portugal no verão, UTC+1 — foi a causa de várias datas a aparecerem trocadas).
  function toIsoLocal(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function monthLabel(key){
    const [y,m] = key.split('-').map(Number);
    return `${MON_FULL[m-1]} ${y}`;
  }
  function monthRange(key){
    const [y,m] = key.split('-').map(Number);
    const start = new Date(y, m-1, 1);
    const end = new Date(y, m, 0);
    return [toIsoLocal(start), toIsoLocal(end)];
  }
  function addMonths(key, n){
    const [y,m] = key.split('-').map(Number);
    const d = new Date(y, m-1+n, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function renewalDatesInMonth(cicloInicioIso, monthStartIso, monthEndIso){
    if(!cicloInicioIso) return [];
    const anchor = parseDate(cicloInicioIso);
    const start = parseDate(monthStartIso);
    const end = parseDate(monthEndIso);
    const diffDays = Math.round((start - anchor)/86400000);
    const k0 = Math.floor(diffDays/28);
    const dates = [];
    for(let k = k0-1; k <= k0+2; k++){
      const d = new Date(anchor);
      d.setDate(d.getDate() + k*28);
      if(d >= start && d <= end) dates.push(toIsoLocal(d));
    }
    return dates;
  }

  // Datas de validade realmente conhecidas no passado (a partir do histórico de alterações).
  // Já não filtra por "múltiplo de 7 dias" — isso bloqueava edições manuais legítimas feitas
  // através do botão de editar caderneta. Agora que há edição/eliminação manual disponível,
  // confia-se em qualquer valor "depois" registado (é sempre o que ficou mesmo a valer),
  // e só se aceita "antes" até à validade atual, para nunca mostrar datas ainda por acontecer.
  function getKnownValidadeHistory(client){
    const set = new Set();
    const anchor = client.cicloValidade;
    if(anchor) set.add(anchor);
    (client.historico||[]).forEach(h => {
      (h.changes||[]).forEach(ch => {
        // Só entra se estiver a um múltiplo exato de 7 dias (semanas inteiras) da validade
        // atual — filtra ruído de testes/edições antigas acumuladas no histórico, sem
        // esconder cadernetas cujo prolongamento (sempre em semanas) quebrou o ciclo de 28.
        if(ch.campo !== 'cicloValidade' || !anchor) return;
        if(ch.depois && ch.depois <= anchor && daysBetween(ch.depois, anchor) % 7 === 0) set.add(ch.depois);
        if(ch.antes && ch.antes <= anchor && daysBetween(ch.antes, anchor) % 7 === 0) set.add(ch.antes);
      });
    });
    // Datas confirmadas manualmente (via o botão de editar caderneta) entram sempre,
    // mesmo que não caiam numa semana certa — foi o próprio utilizador que as escolheu.
    (client.cadernetaBoundariesConfirmadas || []).forEach(d => {
      if(!anchor || d <= anchor) set.add(d);
    });
    return Array.from(set).sort();
  }

  // Combina datas reais conhecidas (histórico) com extrapolação segura só para a frente
  // (a partir da validade atual — nunca para trás, onde prolongamentos passados quebrariam a grelha de 28 dias).
  function renewalDatesInMonthForClient(client, monthStartIso, monthEndIso){
    const results = new Set();
    getKnownValidadeHistory(client).forEach(d => {
      if(d >= monthStartIso && d <= monthEndIso) results.add(d);
    });
    if(client.cicloValidade){
      let d = client.cicloValidade;
      let guard = 0;
      while(d <= monthEndIso && guard < 1000){
        if(d >= monthStartIso) results.add(d);
        d = addDays(d, 28);
        guard++;
      }
    }
    return Array.from(results).sort();
  }

  // Mesma lógica, mas para a data de INÍCIO de cada caderneta (não a validade/fim).
  function getKnownInicioCadernetaHistory(client){
    const set = new Set();
    const anchor = client.inicioCadernetaAtual;
    if(anchor) set.add(anchor);
    (client.historico||[]).forEach(h => {
      (h.changes||[]).forEach(ch => {
        if(ch.campo !== 'inicioCadernetaAtual' || !anchor) return;
        if(ch.depois && ch.depois <= anchor && daysBetween(ch.depois, anchor) % 7 === 0) set.add(ch.depois);
        if(ch.antes && ch.antes <= anchor && daysBetween(ch.antes, anchor) % 7 === 0) set.add(ch.antes);
      });
    });
    // Datas confirmadas manualmente (editar caderneta) entram sempre, mesmo fora da grelha.
    (client.cadernetaBoundariesConfirmadas || []).forEach(d => {
      if(!anchor || d <= anchor) set.add(d);
    });
    // Remove fronteiras eliminadas manualmente (botão de eliminar caderneta) —
    // funciona mesmo quando a fronteira nunca teve uma ação registada no histórico
    // (ex: veio da importação inicial), já que aqui não depende de encontrar uma entrada.
    (client.cadernetaBoundariesRemovidas || []).forEach(d => set.delete(d));
    return Array.from(set).sort();
  }

  function cadernetaStartDatesInMonthForClient(client, monthStartIso, monthEndIso){
    const results = new Set();
    getKnownInicioCadernetaHistory(client).forEach(d => {
      if(d >= monthStartIso && d <= monthEndIso) results.add(d);
    });
    if(client.inicioCadernetaAtual){
      let d = client.inicioCadernetaAtual;
      let guard = 0;
      while(d <= monthEndIso && guard < 1000){
        if(d >= monthStartIso) results.add(d);
        d = addDays(d, 28);
        guard++;
      }
    }
    return Array.from(results).sort();
  }

  // Datas a usar para efeitos de Receita/Mês: o início real da caderneta ATUAL conta
  // sempre no seu próprio mês (mesmo que essa caderneta tenha sido prolongada depois —
  // o pagamento já aconteceu nesse início, o prolongamento só adia o fim). Para as
  // cadernetas seguintes (ainda por vir), a próxima começa exatamente na validade atual
  // (já com qualquer prolongamento aplicado) — nunca numa data intermédia de 4 em 4
  // semanas a partir do início, que deixaria de ser real assim que houvesse um prolongamento.
  function receitaDatesInMonthForClient(client, monthStartIso, monthEndIso){
    const results = new Set();
    if(client.inicioCadernetaAtual && client.inicioCadernetaAtual >= monthStartIso && client.inicioCadernetaAtual <= monthEndIso){
      results.add(client.inicioCadernetaAtual);
    }
    getKnownInicioCadernetaHistory(client).forEach(d => {
      if(d >= monthStartIso && d <= monthEndIso) results.add(d);
    });
    if(client.cicloValidade){
      let d = client.cicloValidade;
      let guard = 0;
      while(d <= monthEndIso && guard < 1000){
        if(d >= monthStartIso) results.add(d);
        d = addDays(d, 28);
        guard++;
      }
    }
    return Array.from(results).sort();
  }

  function todayISO(){
    const d = new Date();
    return toIsoLocal(d);
  }
  function parseDate(iso){
    if(!iso) return null;
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = parseDate(iso);
    return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  }
  function fmtDateShort(iso){
    if(!iso) return '—';
    const d = parseDate(iso);
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }
  // Frases motivacionais para juntar ao lembrete de treino — escolhida uma ao acaso
  // de cada vez que a mensagem é gerada.

  function fraseMotivacionalAleatoria(){

  // Texto da mensagem de lembrete de treino, com saudação, data/hora e frase motivacional aleatória.
  function buildLembreteTreinoTexto(client){

    const horaFormatada = client.proximoTreino.hora ? ` às ${client.proximoTreino.hora}` : '';

    return `Olá ${primeiroNome}! O teu próximo treino está marcado para ${dataFormatada}${horaFormatada}. ${fraseMotivacionalAleatoria()}`;

  // Constrói o link "wa.me" com o contacto do cliente e o texto dado já preenchido.
  // Abre o WhatsApp com a mensagem pronta — o utilizador ainda tem de tocar em enviar
  // (o WhatsApp não permite envio totalmente automático a partir de um site).
  function buildWhatsAppLink(client, texto){
    if(!client.contacto || !texto) return null;
    let phone = String(client.contacto).replace(/[^\d+]/g, '');
    if(phone.startsWith('+')) phone = phone.slice(1);

  // Período coberto por um pagamento: começa no "Início da Caderneta" real do cliente e
  // termina exatamente na "Válida até" real (já com qualquer prolongamento aplicado) —
  // os mesmos valores que aparecem na ficha. Se o pagamento cobrir mais que uma caderneta,
  // as seguintes projetam-se a partir daí, de 4 em 4 semanas.
  function pagamentoCoberturaLabel(p, client){
    const cadernetas = p.cadernetas || 1;
    const inicio = (client && client.inicioCadernetaAtual) || p.data;
    const fim = (client && client.cicloValidade)
      ? addDays(client.cicloValidade, 28 * (cadernetas - 1))
      : addDays(inicio, 28 * cadernetas);
    return `${fmtDateShort(inicio)} a ${fmtDateShort(fim)}`;
  }
  function addDays(iso, n){
    const d = parseDate(iso);
    d.setDate(d.getDate()+n);
    return toIsoLocal(d);
  }
  function daysBetween(fromIso, toIso){
    const a = parseDate(fromIso), b = parseDate(toIso);
    return Math.round((b-a)/86400000);
  }
  function age(nascIso){
    if(!nascIso) return null;
    const b = parseDate(nascIso), t = new Date();
    let a = t.getFullYear() - b.getFullYear();
    const m = t.getMonth() - b.getMonth();
    if(m < 0 || (m===0 && t.getDate() < b.getDate())) a--;
    return a;
  }
  function daysToNextBirthday(nascIso){
    if(!nascIso) return 9999;
    const b = parseDate(nascIso);
    const t = new Date(); t.setHours(0,0,0,0);
    let next = new Date(t.getFullYear(), b.getMonth(), b.getDate());
    if(next < t) next = new Date(t.getFullYear()+1, b.getMonth(), b.getDate());
    return Math.round((next-t)/86400000);
  }
  function inicioCaderneta(client){
    return client.inicioCadernetaAtual || addDays(client.cicloValidade, -28);
  }
  function cycleTrainedCount(client){
    const inicio = inicioCaderneta(client);
    // O dia de início é a sexta-feira em que a caderneta anterior caducou/renovou;
    // um treino marcado exatamente nesse dia pertence à caderneta anterior, não a esta.
    return (client.treinos||[]).filter(t => t.data > inicio).length;
  }
  function ultimoTreino(client){
    const treinos = client.treinos || [];
    if(treinos.length === 0) return null;
    return treinos.slice().sort((a,b) => {
      const da = a.data + (a.hora||'00:00');
      const db = b.data + (b.hora||'00:00');
      return db.localeCompare(da);
    })[0];
  }
  function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // Reconstrução por fronteiras REAIS (não por contagem de sessões): usa os inícios
  // conhecidos (histórico + atual) e a validade atual para fechar a última. Cada
  // caderneta fica editável, porque corresponde a uma fronteira concreta guardada.
  // Substitui um valor de fronteira por outro, em todos os sítios onde é referenciado
  // (campo ao vivo + qualquer entrada do histórico) — usado para editar cadernetas
  // anteriores, já que o mesmo dia costuma aparecer em mais que uma entrada.
  function updateInicioCadernetaBoundary(client, oldValue, newValue){
    if(client.inicioCadernetaAtual === oldValue) client.inicioCadernetaAtual = newValue;
    (client.historico||[]).forEach(h => (h.changes||[]).forEach(ch => {
      if(ch.campo === 'inicioCadernetaAtual'){
        if(ch.antes === oldValue) ch.antes = newValue;
        if(ch.depois === oldValue) ch.depois = newValue;
      }
    }));
    if(client.cadernetaBoundariesConfirmadas){
      const idx = client.cadernetaBoundariesConfirmadas.indexOf(oldValue);
      if(idx !== -1) client.cadernetaBoundariesConfirmadas[idx] = newValue;
    }
  }
  function updateCicloValidadeBoundary(client, oldValue, newValue){
    if(client.cicloValidade === oldValue) client.cicloValidade = newValue;
    (client.historico||[]).forEach(h => (h.changes||[]).forEach(ch => {
      if(ch.campo === 'cicloValidade'){
        if(ch.antes === oldValue) ch.antes = newValue;
        if(ch.depois === oldValue) ch.depois = newValue;
      }
    }));
    if(client.cadernetaBoundariesConfirmadas){
      const idx = client.cadernetaBoundariesConfirmadas.indexOf(oldValue);
      if(idx !== -1) client.cadernetaBoundariesConfirmadas[idx] = newValue;
    }
  }

  function computeCadernetasHistorico(client){
    // Nunca mostra nada além da caderneta atual: qualquer data conhecida DEPOIS do
    // início atual ainda não aconteceu de verdade (pode ser resíduo de testes/edições
    // antigas), por isso é sempre descartada aqui.
    const inicios = getKnownInicioCadernetaHistory(client).filter(d => !client.inicioCadernetaAtual || d <= client.inicioCadernetaAtual);
    const treinosOrdenados = (client.treinos || []).slice().sort((a,b) => a.data.localeCompare(b.data));
    const blocos = [];

    // Treinos anteriores ao primeiro início conhecido (de antes de haver histórico rastreado)
    if(inicios.length > 0){
      const antesDoPrimeiro = treinosOrdenados.filter(t => t.data <= inicios[0]);
      if(antesDoPrimeiro.length > 0){
        blocos.push({
          numero: 0, treinos: antesDoPrimeiro, completo: true, emCurso: false,
          inicio: null, fim: inicios[0], dias: null, prolongada: false, editavel: false
        });
      }
    }

    for(let i = 0; i < inicios.length; i++){
      const inicio = inicios[i];
      const emCurso = inicio === client.inicioCadernetaAtual;
      const fim = emCurso ? client.cicloValidade : inicios[i+1];
      if(!fim) continue; // segurança: sem fim conhecido e não é a atual, ignora
      const treinosDoBloco = treinosOrdenados.filter(t => t.data > inicio && t.data <= fim);
      const dias = daysBetween(inicio, fim);
      blocos.push({
        numero: blocos.length + (blocos[0] && blocos[0].numero===0 ? 0 : 1),
        treinos: treinosDoBloco,
        completo: !emCurso,
        emCurso,
        inicio, fim, dias,
        prolongada: dias > 28,
        editavel: true
      });
    }
    // renumera de forma simples e sequencial para exibição
    let n = 1;
    blocos.forEach(b => { if(b.numero !== 0) b.numero = n++; });

    // Sessões em atraso de uma caderneta passam automaticamente para a seguinte (só visual —
    // não afeta comissões/receita, só quantos quadradinhos/expectativa aparecem na ficha).
    let atraso = 0;
    blocos.forEach(b => {
      if(b.numero === 0){
        b.esperadasComAtraso = client.sessoesEsperadas || 0;
        return;
      }
      b.esperadasComAtraso = (client.sessoesEsperadas || 0) + atraso;
      atraso = Math.max(0, b.esperadasComAtraso - b.treinos.length);
    });

    return blocos;
  }

  // Sessões esperadas da caderneta ATUAL, já incluindo qualquer atraso transportado da
  // caderneta anterior (só visual — não afeta comissões/receita). Usa-se em qualquer sítio
  // que mostre "X/Y treinos" da caderneta em curso (Dashboard, Lista, Ficha do Cliente).
  function sessoesEsperadasAtuaisComAtraso(client){
    const blocos = computeCadernetasHistorico(client);
    const atual = blocos.find(b => b.emCurso);
    return atual ? atual.esperadasComAtraso : (client.sessoesEsperadas || 0);
  }

  // Dado um número de caderneta (1, 2, 3...), procura a data real de início — nas já
  // registadas usa o histórico reconstruído; para além da atual, projeta para a frente
  // de 4 em 4 semanas a partir da validade atual.
  function getCadernetaInicioPorNumero(client, numero){
    if(!numero || numero < 1) return null;
    const blocos = computeCadernetasHistorico(client).filter(b => b.numero > 0);
    const match = blocos.find(b => b.numero === numero);
    if(match) return match.inicio;
    const ultimo = blocos[blocos.length - 1];
    if(!ultimo || !ultimo.fim) return null;
    const passosAFrente = numero - ultimo.numero;
    if(passosAFrente <= 0) return null;
    return addDays(ultimo.fim, 28 * (passosAFrente - 1));
  }


  function parseSessions(atividade){
    const a = (atividade||'').toLowerCase();
    let m = a.match(/(\d+)\s*x\s*(\d+)/);
    if(m) return parseInt(m[1]) * parseInt(m[2]);
    m = a.match(/(\d+)\s*x\s*semana/);
    if(m) return parseInt(m[1]) * 4;
    return 4;
  }

  const CAMPO_LABELS = {

  function formatChangeValue(campo, val){
    if(campo === 'cicloValidade'){

    if(campo === 'cicloInicio' || campo === 'nascimento' || campo === 'inicioCadernetaAtual' || campo === 'pagoAte'){

  function fmtDateTime(iso){
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${dd}/${mm}/${d.getFullYear()} ${hh}:${mi}`;
  }
  function logChange(client, label, changes){
    if(!changes || changes.length === 0) return;

  }
  function undoLastChange(client){
    if(!client.historico || client.historico.length === 0) return false;
    const entry = client.historico.shift();
    entry.changes.forEach(ch => { client[ch.campo] = ch.antes; });
    return true;
  }
  function undoSpecificChange(client, entryId){
    const idx = (client.historico||[]).findIndex(h => h.id === entryId);
    if(idx === -1) return false;
    const entry = client.historico[idx];

  // Renovação automática: qualquer caderneta cuja validade já tenha passado avança sozinha
  // +4 semanas (pode repetir várias vezes se tiverem passado vários ciclos sem abrir a app).
  // Cada passo fica registado no histórico como "Renovação automática", por isso pode
  // ser desfeito manualmente como qualquer outra alteração.
  // Renova UM cliente enquanto a validade estiver no passado (pode avançar vários ciclos de
  // uma vez se tiver ficado muito tempo sem renovar). Só é chamada por ação explícita do utilizador
  // (botão individual, ou "Renovar todas as expiradas" na notificação) — nunca sozinha ao abrir a app.
  function renewClientIfOverdue(c){
    let anyChange = false;
    const today = todayISO();
    let guard = 0;
    while(c.cicloValidade && today > c.cicloValidade && guard < 52){
      const antesInicioCaderneta = inicioCaderneta(c);
      const antesValidade = c.cicloValidade;
      const novoInicioCaderneta = c.cicloValidade;
      const novaValidade = addDays(novoInicioCaderneta, 28);
      logChange(c, 'Renovação (+4 sem.)', [
        { campo: 'inicioCadernetaAtual', rotulo: 'Início da Caderneta', antes: antesInicioCaderneta, depois: novoInicioCaderneta },
        { campo: 'cicloValidade', rotulo: 'Validade', antes: antesValidade, depois: novaValidade }
      ]);
      c.inicioCadernetaAtual = novoInicioCaderneta;
      c.cicloValidade = novaValidade;
      anyChange = true;
      guard++;
    }
    return anyChange;
  }

  async function renewAllExpiredClients(clientIds){
    let anyChange = false;
    state.clients.forEach(c => {
      if(clientIds && !clientIds.includes(c.id)) return;
      if(renewClientIfOverdue(c)) anyChange = true;
    });
    if(anyChange) await saveData();
    return anyChange;
  }

  // Calcula cadernetas expiradas e a expirar dentro de 1 semana, para a notificação ao abrir a app.
  function computeCadernetasAlertas(){
    const today = todayISO();
    const expiradas = [];
    const expirando3Semanas = [];
    state.clients.forEach(c => {
      if(!c.cicloValidade) return;
      if(c.cicloValidade < today){
        expiradas.push(c);
      } else {
        const dias = daysBetween(today, c.cicloValidade);
        if(dias <= 7) expirando3Semanas.push({ c, dias });
      }
    });
    expirando3Semanas.sort((a,b) => a.dias - b.dias);
    return { expiradas, expirando3Semanas };
  }

  // Processa silenciosamente os clientes marcados com "autoRenovar" cuja validade já passou.
  // O sinalizador é reposto a false depois de usado, para pedir confirmação de novo no ciclo seguinte.
  async function processAutoRenovarMarcados(){
    const today = todayISO();
    let anyChange = false;
    state.clients.forEach(c => {
      if(c.autoRenovar && c.cicloValidade && c.cicloValidade < today){
        if(renewClientIfOverdue(c)){
          c.autoRenovar = false;
          anyChange = true;
        }
      }
    });
    if(anyChange) await saveData();
    return anyChange;
  }

  async function checkCadernetasNotification(){
    await processAutoRenovarMarcados();
    const { expiradas, expirando3Semanas } = computeCadernetasAlertas();
    if(expiradas.length === 0 && expirando3Semanas.length === 0) return;
    state.modal = {
      type: 'notificacaoCadernetas',
      expiradasIds: expiradas.map(c => c.id),
      expirandoIds: expirando3Semanas.map(x => x.c.id)
    };
    showModal();
  }

  // ---------- GOOGLE CALENDAR ----------
  const GOOGLE_CLIENT_ID_KEY = 'google_client_id';

  // status: 'not-configured' | 'configured' | 'connected'

  function initGoogleAuth(){

      const saved = localStorage.getItem(GOOGLE_CLIENT_ID_KEY);
      if(saved){

  const GOOGLE_AUTO_IMPORT_DAYS = 84; // 12 semanas

  function setupGoogleTokenClient(){
    if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return false;
    if(!googleAuth.clientId) return false;
    googleAuth.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: googleAuth.clientId,
      scope: GOOGLE_SCOPE,
      callback: (resp) => {
        const wasSilent = googleAuth._silentAttempt;
        googleAuth._silentAttempt = false;
        if(resp.error){
          if(!wasSilent) showToast('Erro ao ligar ao Google: ' + resp.error);
          return;
        }
        googleAuth.token = resp.access_token;
        googleAuth.status = 'connected';
        if(!wasSilent) showToast('Ligado ao Google Calendar');
        render();
        if(googleTrainingColorId){
          importTreinosFromGoogleCalendar(GOOGLE_AUTO_IMPORT_DAYS, true);
        }
      }
    });
    return true;
  }

  function saveGoogleClientId(id){

    googleAuth.status = 'configured';
    setupGoogleTokenClient();
    showToast('Client ID guardado');

  }

  function connectGoogleCalendar(silentAttempt){
    if(!googleAuth.clientId){ if(!silentAttempt) showToast('Cola primeiro o Client ID'); return; }
    if(!googleAuth.tokenClient){
      const ok = setupGoogleTokenClient();
      if(!ok){ if(!silentAttempt) showToast('A biblioteca do Google ainda não carregou. Tenta outra vez em alguns segundos.'); return; }
    }
    googleAuth._silentAttempt = !!silentAttempt;
    googleAuth.tokenClient.requestAccessToken(silentAttempt ? { prompt: 'none' } : {});
  }

  function tryAutoConnectGoogle(attemptsLeft){
    if(attemptsLeft === undefined) attemptsLeft = 20;
    if(googleAuth.status === 'not-configured') return; // nunca configurado, nada a fazer
    if(googleAuth.status === 'connected') return; // já ligado nesta sessão
    if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
      if(attemptsLeft > 0) setTimeout(() => tryAutoConnectGoogle(attemptsLeft - 1), 500);
      return;
    }
    connectGoogleCalendar(true);
  }

  function disconnectGoogleCalendar(){

  async function syncClientToGoogleCalendar(client){

    const eventBody = {
      summary: `Caderneta — ${client.nome}`,
      description: `Renovação da caderneta de ${client.nome}${client.servico ? ' ('+client.servico+')' : ''}. Gerado automaticamente pela app PT Manager.`,
      start: { date: client.cicloValidade },
      end: { date: addDays(client.cicloValidade, 1) }
    };
    // Nota: não aplicamos aqui nenhuma cor por cliente, para nunca coincidir com a cor
    // escolhida globalmente para "treino dado" (evitaria confundir renovações com treinos).
    try{
      let resp;
      if(client.googleEventId){
        resp = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${client.googleEventId}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${googleAuth.token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(eventBody)
        });
        if(resp.status === 404){
          resp = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${googleAuth.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(eventBody)
          });
        }
      } else {
        resp = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${googleAuth.token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(eventBody)
        });
      }
      if(!resp.ok) return false;
      const json = await resp.json();
      client.googleEventId = json.id;
      return true;
    }catch(e){
      console.error('Erro Google Calendar', e);
      return false;
    }
  }

  async function syncAllClientsToGoogleCalendar(){

  function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function nameCombos(nome){
    const words = (nome||'').trim().split(/\s+/).filter(Boolean);
    const combos = new Set();
    if(words.length >= 2){
      combos.add(normHeader(words[0] + ' ' + words[1])); // primeiro + segundo nome
      combos.add(normHeader(words[0] + ' ' + words[words.length-1])); // primeiro nome + apelido
    }
    return Array.from(combos);
  }

  function matchByNameAmong(candidates, norm){
    const fullMatches = candidates.filter(c => norm.includes(normHeader(c.nome)));
    if(fullMatches.length === 1) return fullMatches[0];
    if(fullMatches.length > 1) return null;

    // Nível intermédio: "primeiro nome + segundo nome" ou "primeiro nome + apelido"
    // (ex: "José Rui" ou "Maria Chorado") — mais específico que só o primeiro nome,
    // útil quando há vários clientes com o mesmo primeiro nome.
    const comboMatches = candidates.filter(c => nameCombos(c.nome).some(combo => norm.includes(combo)));
    if(comboMatches.length === 1) return comboMatches[0];
    if(comboMatches.length > 1) return null;

    const firstNameMatches = candidates.filter(c => {
      const firstName = normHeader((c.nome||'').split(' ')[0]);
      if(!firstName) return false;
      const re = new RegExp(`\\b${escapeRegex(firstName)}\\b`);
      return re.test(norm);
    });
    if(firstNameMatches.length === 1) return firstNameMatches[0];
    return null;
  }

  function extractHoraFromEvent(ev){
    if(ev && ev.start && ev.start.dateTime){
      const d = new Date(ev.start.dateTime);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    return '';
  }

  function findClientMatchForEvent(ev){
    const title = ev.summary || '';
    const norm = normHeader(title);
    const byName = matchByNameAmong(state.clients, norm);
    if(byName) return { client: byName, tier: 'nome' };
    const anyFullNameHit = state.clients.some(c => norm.includes(normHeader(c.nome)));
    const anyComboHit = state.clients.some(c => nameCombos(c.nome).some(combo => norm.includes(combo)));
    const anyFirstNameHit = state.clients.some(c => {
      const firstName = normHeader((c.nome||'').split(' ')[0]);
      if(!firstName) return false;
      return new RegExp(`\\b${escapeRegex(firstName)}\\b`).test(norm);
    });
    if(anyFullNameHit || anyComboHit || anyFirstNameHit) return { client: null, tier: 'ambiguous' };
    return { client: null, tier: 'none' };
  }

  async function importTreinosFromGoogleCalendar(days, silent){
    if(!googleAuth.token){ if(!silent) showToast('Liga primeiro ao Google Calendar'); return; }
    if(!googleTrainingColorId){ if(!silent) showToast('Escolhe primeiro a cor que representa "treino dado" no cartão Google Calendar'); return; }
    try{
      const today = todayISO();
      const timeMin = new Date(Date.now() - days*86400000).toISOString();
      const timeMax = new Date(Date.now() + 30*86400000).toISOString(); // inclui 30 dias no futuro, para "próximo treino"
      const windowStart = timeMin.slice(0,10);
      const windowEnd = today; // reconciliação de treinos já importados só olha até hoje (são sempre passados)
      const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime&maxResults=2500`;
      const resp = await fetch(url, { headers: { 'Authorization': `Bearer ${googleAuth.token}` } });
      if(!resp.ok){ if(!silent) showToast('Erro ao ler o Google Calendar'); return; }
      const data = await resp.json();
      const events = data.items || [];
      const eventsById = new Map(events.map(ev => [ev.id, ev]));

      let added = 0, jaExistia = 0, semCorrespondencia = 0, ambiguo = 0, corDiferente = 0, atualizados = 0, removidos = 0, removidosPorCor = 0;

      // Reconciliação: treinos já importados cujo evento, dentro desta janela, foi apagado,
      // reagendado, ou deixou de ter a cor de "treino dado" (ex: mudado para vermelho porque
      // o cliente não veio) no Calendar.
      state.clients.forEach(c => {
        c.treinos = (c.treinos || []).filter(t => {
          if(!t.googleEventId) return true; // registado manualmente, nunca tocar
          if(t.data < windowStart || t.data > windowEnd) return true; // fora da janela consultada, não mexe
          const ev = eventsById.get(t.googleEventId);
          if(!ev){
            removidos++;
            return false; // evento já não existe no Calendar -> remove o treino
          }
          if(String(ev.colorId||'') !== googleTrainingColorId){
            removidosPorCor++;
            return false; // a cor mudou (deixou de ser "treino dado") -> remove o treino
          }
          const novaData = (ev.start && (ev.start.date || (ev.start.dateTime||'').slice(0,10))) || t.data;
          const novaHora = extractHoraFromEvent(ev);
          if(novaData !== t.data || novaHora !== (t.hora||'')){
            t.data = novaData;
            t.hora = novaHora;
            atualizados++;
          }
          return true;
        });
      });

      // Limpa o "próximo treino" de todos antes de recalcular, para não ficar preso a um
      // evento antigo que entretanto já passou, foi apagado ou reagendado.
      state.clients.forEach(c => { c.proximoTreino = null; });

      // Importação: eventos novos, com a cor certa, ainda não registados em nenhum cliente
      events.forEach(ev => {
        if(String(ev.colorId||'') !== googleTrainingColorId){ corDiferente++; return; }
        const rawDate = (ev.start && (ev.start.date || (ev.start.dateTime||'').slice(0,10))) || null;
        if(!rawDate) return;
        const rawHora = extractHoraFromEvent(ev);
        const title = ev.summary || '';

        if(rawDate > today){
          // Evento futuro: não conta como treino dado, só guarda como "próximo treino" (o mais cedo)
          const { client, tier } = findClientMatchForEvent(ev);
          if(tier === 'ambiguous' || !client) return;
          const atual = client.proximoTreino;
          if(!atual || rawDate < atual.data || (rawDate === atual.data && rawHora && rawHora < (atual.hora||'99:99'))){
            client.proximoTreino = { data: rawDate, hora: rawHora, nota: title };
          }
          return;
        }

        const jaRegistado = state.clients.some(c => (c.treinos||[]).some(t => t.googleEventId === ev.id));
        if(jaRegistado){ jaExistia++; return; }
        const { client, tier } = findClientMatchForEvent(ev);
        if(tier === 'ambiguous'){ ambiguo++; return; }
        if(!client){ semCorrespondencia++; return; }
        client.treinos = client.treinos || [];
        client.treinos.push({ id: uid(), data: rawDate, hora: rawHora, nota: title, googleEventId: ev.id });
        added++;
      });

      await saveData();
      const houveMudanca = added > 0 || atualizados > 0 || removidos > 0 || removidosPorCor > 0;
      if(!silent || houveMudanca){
        let msg = `${added} treino(s) importado(s)`;
        if(atualizados) msg += `, ${atualizados} data(s) atualizada(s)`;
        if(removidos) msg += `, ${removidos} removido(s) (evento apagado)`;
        if(removidosPorCor) msg += `, ${removidosPorCor} removido(s) (cor mudada)`;
        if(jaExistia) msg += `, ${jaExistia} já existiam`;
        if(semCorrespondencia) msg += `, ${semCorrespondencia} sem cliente correspondente`;
        if(ambiguo) msg += `, ${ambiguo} ambíguo(s)`;
        if(corDiferente) msg += `, ${corDiferente} ignorado(s) por cor diferente`;
        showToast(msg);
      }
      render();
    }catch(e){
      console.error('Erro a importar do Google Calendar', e);
      if(!silent) showToast('Não foi possível importar do Google Calendar');
    }
  }

  // ---------- SINCRONIZAÇÃO COM FICHEIRO (ex: pasta OneDrive) ----------
  // Usa a File System Access API para ler/escrever um ficheiro JSON escolhido pelo utilizador.
  // Se esse ficheiro estiver dentro de uma pasta sincronizada (OneDrive, Google Drive, etc.),
  // a sincronização entre dispositivos é feita por esse serviço — esta app só lê e escreve o ficheiro.
  const IDB_NAME = 'pt_manager_db';
  const IDB_STORE = 'handles';
  const FSA_SUPPORTED = ('showSaveFilePicker' in window) && ('showOpenFilePicker' in window);

  function idbOpen(){
    return new Promise((resolve,reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, val){
    const db = await idbOpen();
    return new Promise((resolve,reject) => {
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((resolve,reject) => {
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbDelete(key){
    const db = await idbOpen();
    return new Promise((resolve,reject) => {
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  let syncFileHandle = null;
  // sync.status: 'unsupported' | 'none' | 'connected' | 'needs-permission'
  let sync = { status: FSA_SUPPORTED ? 'none' : 'unsupported', fileName: '' };

  async function initSync(){
    if(!FSA_SUPPORTED) return;
    try{
      const handle = await idbGet('sync-file');
      if(handle){
        syncFileHandle = handle;
        sync.fileName = handle.name;
        const perm = await handle.queryPermission({mode:'readwrite'});
        sync.status = perm === 'granted' ? 'connected' : 'needs-permission';
      }
    }catch(e){
      sync.status = 'none';
    }
  }

  async function readSyncFile(){
    if(!syncFileHandle) return null;
    try{
      const file = await syncFileHandle.getFile();
      const text = await file.text();
      if(!text || !text.trim()) return null;
      const parsed = JSON.parse(text);
      return Array.isArray(parsed) ? parsed : null;
    }catch(e){
      return null;
    }
  }

  async function writeSyncFile(){
    if(!syncFileHandle || sync.status !== 'connected') return;
    try{
      const writable = await syncFileHandle.createWritable();
      await writable.write(JSON.stringify(state.clients, null, 2));
      await writable.close();
    }catch(e){
      console.error('Falha ao escrever no ficheiro sincronizado', e);
      sync.status = 'needs-permission';
    }
  }

  async function connectSyncFile(createNew){
    try{
      let handle;
      if(createNew){
        handle = await window.showSaveFilePicker({
          suggestedName: 'pt_clientes_dados.json',
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(state.clients, null, 2));
        await writable.close();
      } else {
        const picked = await window.showOpenFilePicker({
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
        });
        handle = picked[0];
        const file = await handle.getFile();
        const text = await file.text();
        try{
          const parsed = JSON.parse(text);
          if(Array.isArray(parsed) && parsed.length){
            state.clients = parsed.map(migrateClient);
          }
        }catch(e){ /* ficheiro vazio ou inválido: mantém os clientes atuais e grava-os a seguir */ }
      }
      syncFileHandle = handle;
      sync.fileName = handle.name;
      sync.status = 'connected';
      await idbSet('sync-file', handle);
      await saveData();
      showToast('Ficheiro ligado — a sincronizar através dele');
      render();
    }catch(e){
      if(e.name !== 'AbortError') showToast('Não foi possível ligar o ficheiro');
    }
  }

  async function reauthorizeSyncFile(){
    if(!syncFileHandle) return;
    try{
      const perm = await syncFileHandle.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){
        sync.status = 'connected';
        const remote = await readSyncFile();
        if(remote) state.clients = remote.map(migrateClient);
        await saveData();
        showToast('Ligação restabelecida');
        render();
      } else {
        showToast('Permissão não concedida');
      }
    }catch(e){
      showToast('Erro ao pedir permissão');
    }
  }

  async function disconnectSyncFile(){
    syncFileHandle = null;
    sync.status = 'none';
    sync.fileName = '';
    try{ await idbDelete('sync-file'); }catch(e){}
    showToast('Ficheiro desligado. A guardar só neste navegador.');
    render();
  }

  async function loadData(){
    let needsSave = false;
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        state.clients = JSON.parse(raw);
      } else {
        state.clients = SEED_CLIENTS;
        needsSave = true;
      }
    }catch(e){
      state.clients = SEED_CLIENTS;
      needsSave = true;
    }

    await initSync();
    if(sync.status === 'connected'){
      const remote = await readSyncFile();
      if(remote && remote.length){
        state.clients = remote;
      } else {
        needsSave = true; // ficheiro vazio: escreve o que temos localmente
      }
    }

    // migração: garante que clientes já guardados ganham os novos campos sem perder dados existentes
    const before = JSON.stringify(state.clients);
    state.clients = state.clients.map(migrateClient);
    if(JSON.stringify(state.clients) !== before) needsSave = true;

    if(needsSave) await saveData();

    state.financeMonth = monthKey(todayISO());
    state.loaded = true;
    render();
    checkCadernetasNotification();
  }
  let saveTimer = null;
  async function saveData(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state.clients));
    }catch(e){
      console.error('Erro ao guardar', e);
      showToast('Erro ao guardar dados. O espaço de armazenamento do navegador pode estar cheio.');
    }
    await writeSyncFile();
  }
  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    root.appendChild(t);
    setTimeout(()=>t.remove(), 2200);
  }

      root.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--text-dim)">A carregar...</div>`;
      return;
    }

    if(state.view === 'dashboard') html = renderDashboard();
    else if(state.view === 'list') html = renderList();
    else if(state.view === 'financas') html = renderFinancas();
    else if(state.view === 'historico') html = renderHistoricoMensal();

      ${topbarHTML()}
      <div class="content">${html}</div>
      ${(state.view !== 'financas' && state.view !== 'historico') ? '<button class="fab" id="fabAdd">+</button>' : ''}
      ${bottomNavHTML()}

    bindMainEvents();

    if(state.view === 'detail'){

      if(c) showOverlay(renderDetail(c));

      showOverlay(renderForm(state.view === 'edit' ? getClient(state.activeId) : null));

  function renderDashboard(){
    const today = todayISO();
    const birthdays = state.clients
      .map(c => ({c, d: daysToNextBirthday(c.nascimento)}))
      .filter(x => x.d <= 30)
      .sort((a,b) => a.d - b.d);

    const expiring = state.clients
      .map(c => ({c, d: daysBetween(today, c.cicloValidade)}))
      .filter(x => x.d <= 14)
      .sort((a,b) => a.d - b.d);

    let html = '';

    html += `<div class="section-title">Aniversários próximos</div>`;
    if(birthdays.length === 0){
      html += `<div class="empty-state">Sem aniversários nos próximos 30 dias.</div>`;
    } else {
      birthdays.forEach(({c,d}) => {
        const cls = d===0 ? 'urgent' : (d<=7 ? 'bday' : '');
        const label = d===0 ? 'HOJE 🎂' : (d===1 ? 'amanhã' : `em ${d}d`);
        html += `
          <div class="alert-card ${cls==='urgent'?'urgent':'bday'}" data-open="${c.id}">
            <div>
              <div class="name">${escapeHtml(c.nome)}</div>
              <div class="meta">Faz ${age(c.nascimento)+ (d===0?0:1) - (d===0?0:0)} anos · ${fmtDate(c.nascimento)}</div>
            </div>
            <div class="tag ${cls==='urgent'?'urgent':'bday'}">${label}</div>
          </div>`;
      });
    }

    html += `<div class="section-title">Cadernetas a expirar / expiradas</div>`;
    if(expiring.length === 0){
      html += `<div class="empty-state">Nenhuma caderneta a expirar nos próximos 14 dias.</div>`;
    } else {
      expiring.forEach(({c,d}) => {
        const cls = d < 0 ? 'urgent' : (d <= 7 ? 'soon' : '');
        const label = d < 0 ? `expirou há ${Math.abs(d)}d` : (d===0 ? 'expira hoje' : `${d}d restantes`);
        const done = cycleTrainedCount(c);
        html += `
          <div class="alert-card ${cls==='urgent'?'urgent':'soon'}" data-open="${c.id}">
            <div>
              <div class="name">${escapeHtml(c.nome)}</div>
              <div class="meta">${done}/${sessoesEsperadasAtuaisComAtraso(c)} treinos · válida até ${fmtDateShort(c.cicloValidade)}</div>
            </div>
            <div class="tag ${cls==='urgent'?'urgent':'soon'}">${label}</div>
          </div>`;
      });
    }

    return html;
  }

  // Lista de clientes visível (ordenada e filtrada por pesquisa/tipo) — partilhada
  // entre a lista de clientes e a navegação por swipe na ficha do cliente.
  function getVisibleClientsOrdered(){
    const q = state.search.trim().toLowerCase();
    let list = state.clients.slice().sort((a,b) => a.nome.localeCompare(b.nome));
    if(q) list = list.filter(c => c.nome.toLowerCase().includes(q) || String(c.id).toLowerCase().includes(q));
    if(state.filterTipo !== 'all') list = list.filter(c => c.tipo === state.filterTipo);
    return list;
  }

  function renderList(){
    const list = getVisibleClientsOrdered();

    if(list.length === 0){
      return `<div class="empty-state">Nenhum cliente encontrado.</div>`;
    }

    return list.map(c => {
      const st = statusClass(c);
      const done = cycleTrainedCount(c);
      const total = sessoesEsperadasAtuaisComAtraso(c);
      let stamps = '';
      for(let i=0; i<Math.max(total,done); i++){
        const cls = i<total ? (i<done?'filled':'') : 'extra';
        stamps += `<div class="stamp ${cls}"></div>`;
      }
      const bdaySoon = daysToNextBirthday(c.nascimento) <= 7;
      const tipoCls = c.tipo === 'Externo' ? 'externo' : 'interno';
      return `
        <div class="client-card status-${st}" data-open="${c.id}">
          <div class="row1">
            <div class="name"><span class="client-code">#${escapeHtml(c.id)}</span> ${escapeHtml(c.nome)}${bdaySoon?'<span class="badge-inline bday">🎂</span>':''}</div>
            <div class="validade">até ${fmtDateShort(c.cicloValidade)}</div>
          </div>
          <div class="atividade">${escapeHtml(c.atividade || 'Sem atividade definida')} <span class="badge-tipo ${tipoCls}">${c.tipo}</span></div>
          <div class="stamps">${stamps}<span class="stamps-label">${done}/${total}</span></div>
        </div>
      `;
    }).join('');
  }

  // ---------- FINANÇAS ----------
  // Cálculo partilhado: sessões esperadas do mês, por cliente, já com o patamar e a
  // isenção de externos aplicados. Usado tanto por Treinos/Mês como por Receita/Mês,
  // para que a comissão de cada cliente reflita sempre o total combinado do mês.
  function computeSessoesMes(key){
    const [start, end] = monthRange(key);
    let all = [];
    state.clients.forEach(c => {
      if(c.concentrarComprasNoMes){
        // Opção "concentrar no mês da compra" (só faz sentido em clientes Externos):
        // conta a totalidade das sessões pagas (nº de cadernetas cobertas x sessões
        // esperadas) de uma vez, no mês em que o pagamento foi feito — em vez de
        // espalhar pelas cadernetas normais.
        (c.pagamentos||[]).forEach(p => {
          if(p.data >= start && p.data <= end){
            const cadernetas = p.cadernetas || 1;
            const sessoes = (c.sessoesEsperadas || 0) * cadernetas;
            for(let i = 0; i < sessoes; i++){
              all.push({ client: c, servico: c.servico, tipo: c.tipo });
            }
          }
        });
        return;
      }
      const dates = receitaDatesInMonthForClient(c, start, end);
      dates.forEach(() => {
        const sessoes = c.sessoesEsperadas || 0;
        for(let i = 0; i < sessoes; i++){
          all.push({ client: c, servico: c.servico, tipo: c.tipo });
        }
      });
    });
    const interno = all.filter(x => x.tipo !== 'Externo');
    const externo = all.filter(x => x.tipo === 'Externo');
    const total = all.length;
    const patamar = total >= PATAMAR_INTERNO ? 'alto' : 'baixo';

    interno.forEach(x => { x.comissao = (COMISSOES[x.servico]||{})[patamar] || 0; });

    const externoOrdenado = externo.slice().sort((a,b) =>
      ((COMISSOES[a.servico]||{}).externo||0) - ((COMISSOES[b.servico]||{}).externo||0)
    );
    const isentos = Math.max(0, externoOrdenado.length - ISENCAO_EXTERNO);
    externoOrdenado.forEach((x, idx) => {
      x.comissao = idx < isentos ? 0 : ((COMISSOES[x.servico]||{}).externo || 0);
    });

    const porCliente = new Map();
    all.forEach(x => {
      const id = x.client.id;
      if(!porCliente.has(id)) porCliente.set(id, { comissaoInterno: 0, comissaoExterno: 0, sessoesInterno: 0, sessoesExterno: 0 });
      const entry = porCliente.get(id);
      if(x.tipo === 'Externo'){ entry.comissaoExterno += (x.comissao||0); entry.sessoesExterno++; }
      else { entry.comissaoInterno += (x.comissao||0); entry.sessoesInterno++; }
    });

    // Contagem de sessões por serviço + tipo (para o resumo PT30/PT60 interno/externo)
    const porServicoTipo = {};
    all.forEach(x => {
      const chave = `${x.servico}_${x.tipo === 'Externo' ? 'Externo' : 'Interno'}`;
      porServicoTipo[chave] = (porServicoTipo[chave] || 0) + 1;
    });

    return { total, internoCount: interno.length, externoCount: externo.length, patamar, isentos, porCliente, porServicoTipo };
  }

  function computeTreinosMes(key){
    const s = computeSessoesMes(key);
    let comissaoInterno = 0, comissaoExterno = 0;
    s.porCliente.forEach(v => { comissaoInterno += v.comissaoInterno; comissaoExterno += v.comissaoExterno; });

    // Lista de clientes com sessões neste mês (cadernetas renovadas/iniciadas no mês em referência)
    const rowsInterno = [], rowsExterno = [];
    state.clients.forEach(c => {
      const v = s.porCliente.get(c.id);
      if(v && (v.sessoesInterno + v.sessoesExterno) > 0){
        const row = {
          c,
          sessoes: v.sessoesInterno + v.sessoesExterno,
          comissaoInterno: v.comissaoInterno,
          comissaoExterno: v.comissaoExterno
        };
        if(c.tipo === 'Externo') rowsExterno.push(row); else rowsInterno.push(row);
      }
    });
    rowsInterno.sort((a,b) => b.sessoes - a.sessoes);
    rowsExterno.sort((a,b) => b.sessoes - a.sessoes);

    // Dinheiro que entra no mês: pagamentos realmente registados (Pagamentos/Mês)
    const pm = computePagamentosMes(key);
    const totalRecebidoMes = pm.totalValor;
    const valorRecebidoExterno = pm.totalExterno;
    const valorLiquidoExterno = valorRecebidoExterno - comissaoExterno;

    // PT30/PT60/PT Group 60 comprados no mês, por Interno/Externo
    const pt30Interno = s.porServicoTipo['PT 30_Interno'] || 0;
    const pt30Externo = s.porServicoTipo['PT 30_Externo'] || 0;
    const pt60Interno = s.porServicoTipo['PT 60_Interno'] || 0;
    const pt60Externo = s.porServicoTipo['PT 60_Externo'] || 0;
    const ptGroup60Interno = s.porServicoTipo['PT Group 60_Interno'] || 0;
    const ptGroup60Externo = s.porServicoTipo['PT Group 60_Externo'] || 0;

    // Treinos DADOS de verdade nesse mês (data real do treino), não sessões compradas
    const [start, end] = monthRange(key);
    let treinosDadosInterno = 0, treinosDadosExterno = 0;
    state.clients.forEach(c => {
      const n = (c.treinos||[]).filter(t => t.data >= start && t.data <= end).length;
      if(c.tipo === 'Externo') treinosDadosExterno += n; else treinosDadosInterno += n;
    });

    return {
      total: s.total, internoCount: s.internoCount, externoCount: s.externoCount, patamar: s.patamar,
      comissaoInterno, comissaoExterno, isentos: s.isentos,
      totalRecebidoMes, valorRecebidoExterno, valorLiquidoExterno,
      pt30Interno, pt30Externo, pt60Interno, pt60Externo, ptGroup60Interno, ptGroup60Externo,
      treinosDadosInterno, treinosDadosExterno, treinosDadosTotal: treinosDadosInterno + treinosDadosExterno,
      rowsInterno, rowsExterno
    };
  }

  function computeReceitaMes(key){
    const [start,end] = monthRange(key);
    const sessoesMes = computeSessoesMes(key);
    let rows = [];
    state.clients.forEach(c => {
      let dates = receitaDatesInMonthForClient(c, start, end);
      if(c.pagoAte){
        dates = dates.filter(d => d > c.pagoAte); // já pago adiantado até esta data: não conta como receita nova
      }
      if(dates.length > 0){
        const v = sessoesMes.porCliente.get(c.id) || { comissaoInterno: 0, comissaoExterno: 0 };
        rows.push({
          c, count: dates.length, dates,
          valor: dates.length * Number(c.valorCaderneta||0),
          comissaoInterno: v.comissaoInterno,
          comissaoExterno: v.comissaoExterno
        });
      }
    });
    rows.sort((a,b) => a.dates[0].localeCompare(b.dates[0]));
    const totalInterno = rows.filter(r => r.c.tipo !== 'Externo').reduce((s,r)=>s+r.valor,0);
    const totalExterno = rows.filter(r => r.c.tipo === 'Externo').reduce((s,r)=>s+r.valor,0);
    return { rows, totalInterno, totalExterno, total: totalInterno + totalExterno, patamar: sessoesMes.patamar };
  }

  // Relatório mensal baseado nos PAGAMENTOS REALMENTE REGISTADOS (não numa projeção de renovações).
  // Um pagamento que cubra várias cadernetas de uma vez entra por inteiro no mês em que foi feito.
  function computePagamentosMes(key){
    const [start,end] = monthRange(key);
    let rows = [];
    state.clients.forEach(c => {
      (c.pagamentos||[]).forEach(p => {
        const cadernetas = p.cadernetas || 1;
        const inicioRef = p.inicioCadernetaRef || p.data;
        if(c.concentrarComprasNoMes){
          // Fica tudo concentrado no mês de início do período pago — a totalidade das
          // sessões e do valor conta de uma vez só, no mês da 1ª caderneta, tal como já
          // acontece no Treinos/Mês para estes clientes (nunca se espalha por vários meses).
          if(inicioRef >= start && inicioRef <= end){
            rows.push({
              c, pagamento: p,
              cadernetas,
              sessoes: (c.sessoesEsperadas || 0) * cadernetas,
              valor: Number(p.valor||0),
              inicioCadernetaUnidade: inicioRef,
            });
          }
          return;
        }
        // Cada caderneta coberta por este pagamento conta no mês em que ELA começa,
        // não no mês da data do pagamento — um pagamento de 6 cadernetas de uma vez
        // pode assim espalhar-se por vários meses, cada um com a sua parte proporcional.
        let d = inicioRef;
        for(let i = 0; i < cadernetas; i++){
          if(d >= start && d <= end){
            rows.push({
              c, pagamento: p,
              cadernetas: 1,
              sessoes: c.sessoesEsperadas || 0,
              valor: Number(p.valor||0) / cadernetas,
              inicioCadernetaUnidade: d,
            });
          }
          d = addDays(d, 28);
        }
      });
    });
    rows.sort((a,b) => b.valor - a.valor);
    const totalValor = rows.reduce((s,r)=>s+r.valor,0);
    const totalCadernetas = rows.reduce((s,r)=>s+r.cadernetas,0);
    const totalSessoes = rows.reduce((s,r)=>s+r.sessoes,0);
    const totalInterno = rows.filter(r=>r.c.tipo!=='Externo').reduce((s,r)=>s+r.valor,0);
    const totalExterno = rows.filter(r=>r.c.tipo==='Externo').reduce((s,r)=>s+r.valor,0);
    // Só os clientes Externos pagam diretamente ao PT — os Internos pagam ao ginásio,
    // por isso estes três nunca têm contribuição real de clientes Internos na prática.
    const rowsExterno = rows.filter(r => r.c.tipo === 'Externo');
    const nPagamentosExterno = new Set(rowsExterno.map(r => r.pagamento.id)).size;
    const totalCadernetasExterno = rowsExterno.reduce((s,r)=>s+r.cadernetas,0);
    const totalSessoesExterno = rowsExterno.reduce((s,r)=>s+r.sessoes,0);
    return { rows, totalValor, totalCadernetas, totalSessoes, totalInterno, totalExterno, nPagamentosExterno, totalCadernetasExterno, totalSessoesExterno };
  }

  // ---------- RELATÓRIO EXCEL ----------
  // ---------- ESTILOS DO RELATÓRIO EXCEL (cores + bordas) ----------
  const COR_HEADER_BG = 'FF1F2937';
  const COR_HEADER_FONT = 'FFFFFFFF';
  const COR_PT_BG = 'FFC6EFCE';       // verde: dinheiro que fica contigo
  const COR_PT_FONT = 'FF006100';
  const COR_DEVE_BG = 'FFFFC7CE';     // vermelho: dinheiro que deves ao ginásio
  const COR_DEVE_FONT = 'FF9C0006';
  const COR_GINASIO_BG = 'FFD9E1F2'; // azul-acinzentado: dinheiro que fica no ginásio
  const COR_GINASIO_FONT = 'FF1F4E78';
  const BORDA_FINA = { style: 'thin', color: { argb: 'FFB0B0B0' } };
  const BORDA_CELULA = { top: BORDA_FINA, left: BORDA_FINA, bottom: BORDA_FINA, right: BORDA_FINA };

  function estiloCabecalhoCelula(cell){
    cell.font = { bold: true, color: { argb: COR_HEADER_FONT } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COR_HEADER_BG } };
    cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
    cell.border = BORDA_CELULA;
  }

  const CORES_DINHEIRO = {
    pt: [COR_PT_BG, COR_PT_FONT],
    deve: [COR_DEVE_BG, COR_DEVE_FONT],
    ginasio: [COR_GINASIO_BG, COR_GINASIO_FONT],
  };

  // Cria uma folha estilizada: cabeçalho escuro, bordas em toda a tabela, linhas
  // alternadas, e cor por coluna quando essa coluna representa dinheiro (moneyColMap:
  // { chaveDaColuna: 'pt' | 'deve' | 'ginasio' }).
  function addStyledSheet(wb, sheetName, columns, rows, moneyColMap){
    const ws = wb.addWorksheet(sheetName);
    ws.columns = columns.map(c => ({ header: c.header, key: c.key, width: c.width || 16 }));
    rows.forEach(r => ws.addRow(r));
    const headerRow = ws.getRow(1);
    headerRow.eachCell(cell => estiloCabecalhoCelula(cell));
    headerRow.height = 28;
    for(let i = 2; i <= ws.rowCount; i++){
      const row = ws.getRow(i);
      row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
        cell.border = BORDA_CELULA;
        const colDef = columns[colNumber - 1];
        const tipoCor = colDef && moneyColMap ? moneyColMap[colDef.key] : null;
        if(tipoCor && CORES_DINHEIRO[tipoCor]){
          const [bg, font] = CORES_DINHEIRO[tipoCor];
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } };
          cell.font = { color: { argb: font } };
        } else if(i % 2 === 0){
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF6F7FA' } };
        }
      });
    }
    ws.views = [{ state: 'frozen', ySplit: 1 }];
    return ws;
  }

  async function downloadWorkbook(wb, filename){
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function buildRelatorioWorkbook(){
    const wb = new ExcelJS.Workbook();
    const currentKey = monthKey(todayISO());
    const endKey = addMonths(currentKey, 3);

    const clientesCols = [
      { header: 'Código', key: 'codigo', width: 10 },
      { header: 'Nome', key: 'nome', width: 28 },
      { header: 'Tipo', key: 'tipo', width: 9 },
      { header: 'Atividade', key: 'atividade', width: 26 },
      { header: 'Serviço', key: 'servico', width: 16 },
      { header: 'Início da Caderneta', key: 'inicio', width: 15 },
      { header: 'Fim Suposto (4 semanas)', key: 'fimSuposto', width: 16 },
      { header: 'Prolongamentos (semanas)', key: 'prolongamentos', width: 16 },
      { header: 'Fim Real (4 semanas + prolongamentos)', key: 'fimReal', width: 22 },
      { header: 'Sessões Esperadas', key: 'sessoesEsperadas', width: 15 },
      { header: 'Sessões Feitas (ciclo atual)', key: 'sessoesFeitas', width: 22 },
      { header: 'Data Pagamento', key: 'dataPagamento', width: 26 },
      { header: 'Valor Pago (€)', key: 'valorPago', width: 18 },
      { header: 'Cadernetas Cobertas', key: 'cadernetasCobertas', width: 18 },
    ];
    const clientesRows = state.clients.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c => {
      const pagamentosExterno = c.tipo === 'Externo' ? (c.pagamentos||[]).slice().sort((a,b)=>a.data.localeCompare(b.data)) : [];
      const inicioCad = c.inicioCadernetaAtual || '';
      const fimSuposto = inicioCad ? addDays(inicioCad, 28) : '';
      const fimReal = c.cicloValidade || '';
      const diasProlongamento = (inicioCad && fimReal) ? Math.max(0, daysBetween(fimSuposto, fimReal)) : 0;
      const semanasProlongamento = Math.round(diasProlongamento / 7);
      return {
        codigo: c.id, nome: c.nome, tipo: c.tipo, atividade: c.atividade, servico: c.servico,
        inicio: inicioCad, fimSuposto, prolongamentos: semanasProlongamento, fimReal,
        sessoesEsperadas: c.sessoesEsperadas, sessoesFeitas: cycleTrainedCount(c),
        dataPagamento: pagamentosExterno.map(p => fmtDateShort(p.data)).join('; '),
        valorPago: pagamentosExterno.map(p => Number(p.valor||0).toFixed(2)).join('; '),
        cadernetasCobertas: pagamentosExterno.map(p => p.cadernetas||1).join('; '),
      };
    });
    addStyledSheet(wb, 'Clientes', clientesCols, clientesRows);

    const treinosCols = [
      { header: 'Cliente', key: 'cliente', width: 28 },
      { header: 'Tipo', key: 'tipo', width: 9 },
      { header: 'Data', key: 'data', width: 12 },
      { header: 'Hora', key: 'hora', width: 8 },
      { header: 'Nota', key: 'nota', width: 30 },
    ];
    let treinosRows = [];
    state.clients.forEach(c => {
      (c.treinos||[]).forEach(t => {
        treinosRows.push({ cliente: c.nome, tipo: c.tipo, data: t.data, hora: t.hora || '', nota: t.nota || '' });
      });
    });
    treinosRows.sort((a,b) => a.data.localeCompare(b.data));
    addStyledSheet(wb, 'Treinos Dados', treinosCols, treinosRows);

    const resumoCols = [
      { header: 'Mês', key: 'mes', width: 14 },
      { header: 'Patamar Comissão', key: 'patamar', width: 16 },
      { header: 'Treinos Interno', key: 'treinosInterno', width: 15 },
      { header: 'Comissão Interno (€)', key: 'comissaoInterno', width: 20 },
      { header: 'Receita Ginásio (€)', key: 'receitaGinasio', width: 18 },
      { header: 'Treinos Externo', key: 'treinosExterno', width: 15 },
      { header: 'Nº Pagamentos Externo', key: 'nPagamentosExterno', width: 18 },
      { header: 'Cadernetas Pagas Externo', key: 'cadernetasPagasExterno', width: 20 },
      { header: 'Sessões Pagas Externo', key: 'sessoesPagasExterno', width: 18 },
      { header: 'Valor Recebido Externo (€)', key: 'valorRecebidoExterno', width: 22 },
      { header: 'Comissão a Pagar Externo (€)', key: 'comissaoPagarExterno', width: 24 },
      { header: 'Valor Líquido Externo (€)', key: 'valorLiquidoExterno', width: 22 },
      { header: 'Receita Prevista Externo (€)', key: 'receitaPrevistaExterno', width: 24 },
      { header: 'Treinos Total', key: 'treinosTotal', width: 13 },
      { header: 'Receita Prevista Total (€)', key: 'receitaPrevistaTotal', width: 22 },
    ];
    let resumoRows = [];
    for(let key = '2026-07'; key <= endKey; key = addMonths(key, 1)){
      const t = computeTreinosMes(key);
      const r = computeReceitaMes(key);
      const pm = computePagamentosMes(key);
      resumoRows.push({
        mes: monthLabel(key),
        nPagamentosExterno: pm.nPagamentosExterno,
        cadernetasPagasExterno: pm.totalCadernetasExterno,
        sessoesPagasExterno: pm.totalSessoesExterno,
        patamar: t.patamar === 'alto' ? `>= ${PATAMAR_INTERNO}` : `< ${PATAMAR_INTERNO}`,
        treinosInterno: t.internoCount,
        comissaoInterno: Number(t.comissaoInterno.toFixed(2)),
        receitaGinasio: Number(r.totalInterno.toFixed(2)),
        treinosExterno: t.externoCount,
        valorRecebidoExterno: Number(pm.totalExterno.toFixed(2)),
        comissaoPagarExterno: Number(t.comissaoExterno.toFixed(2)),
        valorLiquidoExterno: Number(t.valorLiquidoExterno.toFixed(2)),
        receitaPrevistaExterno: Number(r.totalExterno.toFixed(2)),
        treinosTotal: t.total,
        receitaPrevistaTotal: Number(r.total.toFixed(2)),
      });
    }
    addStyledSheet(wb, 'Resumo Mensal', resumoCols, resumoRows, {
      comissaoInterno: 'pt',
      receitaGinasio: 'ginasio',
      valorRecebidoExterno: 'pt',
      comissaoPagarExterno: 'deve',
      valorLiquidoExterno: 'pt',
      receitaPrevistaExterno: 'ginasio',
    });

    // Uma folha por mês, com o detalhe de cadernetas: início, término, prolongamentos,
    // alterações feitas nesse mês e treinos contratados por caderneta.
    const mensalCols = [
      { header: 'Código', key: 'codigo', width: 10 },
      { header: 'Nome', key: 'nome', width: 28 },
      { header: 'Início da Caderneta', key: 'inicio', width: 15 },
      { header: 'Término', key: 'termino', width: 14 },
      { header: 'Prolongamentos (semanas)', key: 'prolongamentos', width: 16 },
      { header: 'Alterações no mês', key: 'alteracoes', width: 40 },
      { header: 'Treinos Contratados', key: 'treinosContratados', width: 16 },
    ];
    for(let key = '2026-07'; key <= endKey; key = addMonths(key, 1)){
      const linhas = buildCadernetasMensalRows(key);
      let sheetName = monthLabel(key).replace(/[:\\\/\?\*\[\]]/g, '').slice(0,31);
      addStyledSheet(wb, sheetName, mensalCols, linhas);
    }

    return wb;
  }

  // Constrói as linhas da folha de um mês: uma linha por caderneta que começa nesse mês
  // (ou, se nenhuma começar mas tiver havido alterações nesse mês, uma linha informativa).
  function buildCadernetasMensalRows(key){
    const [start, end] = monthRange(key);
    const rows = [];
    state.clients.slice().sort((a,b) => a.nome.localeCompare(b.nome)).forEach(c => {
      const inicios = receitaDatesInMonthForClient(c, start, end);
      const alteracoesTexto = buildAlteracoesMesTexto(c, start, end);
      if(inicios.length === 0){
        if(alteracoesTexto){
          rows.push({ codigo: c.id, nome: c.nome, inicio: '', termino: '', prolongamentos: '', alteracoes: alteracoesTexto, treinosContratados: '' });
        }
        return;
      }
      inicios.forEach(inicio => {
        let termino;
        if(inicio === c.inicioCadernetaAtual){
          termino = c.cicloValidade;
        } else {
          const conhecidos = getKnownInicioCadernetaHistory(c).filter(d => d > inicio);
          termino = conhecidos.length > 0 ? conhecidos[0] : addDays(inicio, 28);
        }
        const diasTotais = daysBetween(inicio, termino);
        const semanasExtra = Math.max(0, Math.round((diasTotais - 28) / 7));
        rows.push({
          codigo: c.id, nome: c.nome,
          inicio: fmtDateShort(inicio), termino: fmtDateShort(termino),
          prolongamentos: semanasExtra, alteracoes: alteracoesTexto,
          treinosContratados: c.sessoesEsperadas,
        });
      });
    });
    return rows;
  }

  // Junta, num só texto, as alterações à caderneta (início/validade) cuja data de ação
  // caiu dentro deste mês — independentemente de essa alteração corresponder ou não a
  // uma caderneta que também começou neste mês.
  function buildAlteracoesMesTexto(client, monthStartIso, monthEndIso){
    const entradas = [];
    (client.historico||[]).forEach(h => {
      const tocaCaderneta = (h.changes||[]).some(ch => ch.campo === 'cicloValidade' || ch.campo === 'inicioCadernetaAtual');
      if(!tocaCaderneta) return;
      const dataAcao = (h.quando||'').slice(0,10);
      if(dataAcao >= monthStartIso && dataAcao <= monthEndIso){
        entradas.push(`${h.label} (${fmtDateShort(dataAcao)})`);
      }
    });
    return entradas.reverse().join('; ');
  }
